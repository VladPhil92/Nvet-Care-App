<?xml version="1.0" encoding="UTF-8"?>
<!--
  Nvet Care — monochrome variant del símbolo oficial.
  - Misma forma serpenteante de 3 ondulaciones que `logo.svg`
  - El color se aplica via `currentColor` (CSS `color: <hex>`)
  - Para contextos B/N, watermarks, footer one-color, etc.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="256" viewBox="0 0 200 100" fill="none" role="img" aria-label="Nvet Care">
  <title>Nvet Care monochrome</title>

  <!-- Trazo continuo serpenteante en un solo color -->
  <path
    d="M 25 75
       L 25 35
       C 25 22 45 22 45 35
       L 45 55
       C 45 65 60 65 65 55
       L 80 35
       C 80 22 100 22 100 35
       L 100 55
       C 100 65 115 65 120 55
       L 135 35
       C 135 22 155 22 155 35
       L 155 75"
    stroke="currentColor"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Dot del extremo — mismo color con opacidad reducida -->
  <circle cx="170" cy="75" r="6" fill="currentColor" fill-opacity="0.65" />
</svg>
