buildscript {
    ext {
        // Phase 13 / Google Play 2026: new apps and updates submitted from
        // 2026-08-31 must target Android 16 (API 36). AGP 8.10 is the first
        // stable 8.x line with official API 36 support, while retaining JDK 17
        // and avoiding the broader React Native/AGP 9 migration in the release
        // stabilization window.
        buildToolsVersion = "35.0.0"
        minSdkVersion = 23
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.10.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

allprojects {
    repositories {
        maven { url("$rootDir/../../node_modules/detox/Detox-android") }
    }
}

apply plugin: "com.facebook.react.rootproject"
