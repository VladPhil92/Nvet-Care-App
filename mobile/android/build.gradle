buildscript {
    ext {
        // React Native 0.87.1 / Android 16 security migration baseline.
        // Keep target API 36 while aligning the native toolchain to the
        // official RN 0.87.1 template.
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:9.2.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// npm workspaces may place Detox either in mobile/node_modules or hoist it to
// the repository root. Resolve the actual npm-shipped Maven repo instead of
// assuming one layout; fail closed if npm installation did not provide it.
def detoxMavenCandidates = [
    file("$rootDir/../node_modules/detox/Detox-android"),
    file("$rootDir/../../node_modules/detox/Detox-android")
]
def detoxNpmMavenRepo = detoxMavenCandidates.find { it.isDirectory() }
if (detoxNpmMavenRepo == null) {
    throw new GradleException("Detox Android Maven repository not found. Run npm ci before Gradle.")
}

allprojects {
    repositories {
        // Detox's npm package ships the full Android instrumentation AAR in a
        // local Maven repository. Keep com.wix exclusive to that repository so
        // Gradle cannot satisfy the coordinate from Maven Central with the
        // coreNative artifact, which intentionally omits the Detox test harness.
        exclusiveContent {
            forRepository {
                maven {
                    name = "DetoxNpm"
                    url = uri(detoxNpmMavenRepo)
                }
            }
            filter {
                includeGroup("com.wix")
            }
        }
    }
}


// react-native-maps 1.18.0 still declares custom BuildConfig fields. AGP 9
// disables BuildConfig generation for library modules by default, so enable it
// only for that dependency rather than weakening the setting globally.
subprojects { subproject ->
    if (subproject.name == "react-native-maps") {
        subproject.plugins.withId("com.android.library") {
            subproject.android.buildFeatures.buildConfig = true
        }
    }
}

apply plugin: "com.facebook.react.rootproject"