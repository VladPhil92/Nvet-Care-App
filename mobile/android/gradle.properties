org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
android.useAndroidX=true
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
# React Native 0.82+ runs exclusively on the New Architecture.
newArchEnabled=true
hermesEnabled=true
# Android 15+ already enforces edge-to-edge for targetSdk >= 35; keep older
# devices consistent. Screens use react-native-safe-area-context insets.
edgeToEdgeEnabled=true
# Opt out of AGP 9 built-in Kotlin and new DSL, as the React Native 0.87
# template does, until AGP 10 removes these switches.
android.builtInKotlin=false
android.newDsl=false
