// Monorepo: react-native is hoisted to root node_modules, tell Reanimated where to find it
project.ext.REACT_NATIVE_NODE_MODULES_DIR = file("../../../node_modules/react-native").absolutePath

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    root = file("../..")
    reactNativeDir = file("../../../node_modules/react-native")
    codegenDir = file("../../../node_modules/@react-native/codegen")
    cliFile = file("../../../node_modules/react-native/cli.js")
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'
def releaseStoreFile = System.getenv("NVET_ANDROID_KEYSTORE_FILE")
def releaseStorePassword = System.getenv("NVET_ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("NVET_ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("NVET_ANDROID_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

def mapsApiKey = System.getenv("GOOGLE_MAPS_ANDROID_API_KEY") ?: ""
def androidVersionCodeRaw = System.getenv("NVET_ANDROID_VERSION_CODE") ?: "1"
def androidVersionName = System.getenv("NVET_ANDROID_VERSION_NAME") ?: "1.0.0"
def androidVersionCode

try {
    androidVersionCode = Integer.parseInt(androidVersionCodeRaw)
} catch (NumberFormatException ignored) {
    throw new GradleException("NVET_ANDROID_VERSION_CODE must be an integer")
}

if (androidVersionCode < 1 || androidVersionCode > 2100000000) {
    throw new GradleException("NVET_ANDROID_VERSION_CODE must be between 1 and 2100000000")
}

if (!androidVersionName.trim()) {
    throw new GradleException("NVET_ANDROID_VERSION_NAME must not be blank")
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.nvetcare"

    defaultConfig {
        applicationId "com.nvetcare"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode androidVersionCode
        versionName androidVersionName

        testBuildType System.getProperty('testBuildType', 'debug')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [GOOGLE_MAPS_API_KEY: mapsApiKey]
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // Android Gradle Plugin creates/uses the standard ~/.android/debug.keystore.
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
            pickFirsts += ['**/libc++_shared.so']
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.appcompat:appcompat:1.7.0")

    androidTestImplementation("androidx.test:runner:1.6.2")
    androidTestImplementation("androidx.test:rules:1.6.1")
    androidTestImplementation("androidx.test.ext:junit:1.2.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
