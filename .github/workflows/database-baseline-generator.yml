name: Nvet Database Baseline Generator

on:
  push:
    branches:
      - feat/database-recovery-convergence
    paths:
      - '.github/workflows/database-baseline-generator.yml'
      - 'backend/prisma/schema.prisma'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-baseline:
    name: Generate and persist canonical PostgreSQL baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout convergence branch
        uses: actions/checkout@v7
        with:
          ref: feat/database-recovery-convergence

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --legacy-peer-deps

      - name: Generate baseline from empty database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts backend/prisma/migrations/20260801000000_baseline_current_schema
          npx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel backend/prisma/schema.prisma \
            --script > .artifacts/migration.sql
          test -s .artifacts/migration.sql
          cp .artifacts/migration.sql backend/prisma/migrations/20260801000000_baseline_current_schema/migration.sql
          printf '# Please do not edit this file manually\nprovider = "postgresql"\n' > backend/prisma/migrations/migration_lock.toml
          sha256sum .artifacts/migration.sql | tee .artifacts/migration.sha256

      - name: Commit canonical baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/prisma/migrations/20260801000000_baseline_current_schema/migration.sql \
            backend/prisma/migrations/migration_lock.toml
          if git diff --cached --quiet; then
            echo 'Canonical baseline already matches generated Prisma SQL.'
            exit 0
          fi
          git commit -m 'chore(db): persist canonical Prisma baseline'
          git push origin HEAD:feat/database-recovery-convergence

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v7
        with:
          name: nvet-prisma-baseline
          path: |
            .artifacts/migration.sql
            .artifacts/migration.sha256
          if-no-files-found: error
          retention-days: 7
