name: Phase 20 Format Fix

on:
  push:
    branches:
      - feat/vet-recruitment-crm-phase20

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/vet-recruitment-crm-phase20
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=dev --legacy-peer-deps
      - name: Format Phase 20 backend files
        run: npx prettier --write backend/src/recruitment/vet-recruitment.controller.ts backend/src/recruitment/vet-recruitment.service.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/recruitment/vet-recruitment.controller.ts backend/src/recruitment/vet-recruitment.service.ts
          git commit -m "style(recruitment): apply prettier formatting"
          git push origin HEAD:feat/vet-recruitment-crm-phase20
