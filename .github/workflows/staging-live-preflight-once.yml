name: Certify Live Staging Once

on:
  push:
    branches:
      - ops/staging-railway-probe-20260830
    paths:
      - '.github/workflows/staging-live-preflight-once.yml'

permissions:
  contents: read

jobs:
  certify:
    name: Verify live staging fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_API_URL: https://nvet-staging-backend-staging.up.railway.app/api
      E2E_CLIENT_EMAIL: cliente@nvetcare.test
      E2E_CLIENT_PASSWORD: TestClient123!
      E2E_VET_EMAIL: vet@nvetcare.test
      E2E_VET_PASSWORD: TestVet123!
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Verify staging readiness, identities and emergency discovery
        run: node mobile/e2e/preflight.mjs

      - name: Publish certification
        run: |
          echo '## Isolated staging certified' >> "$GITHUB_STEP_SUMMARY"
          echo '- Readiness: passed.' >> "$GITHUB_STEP_SUMMARY"
          echo '- CLIENT login: passed.' >> "$GITHUB_STEP_SUMMARY"
          echo '- VET login: passed.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Emergency fixture discovery: passed.' >> "$GITHUB_STEP_SUMMARY"
