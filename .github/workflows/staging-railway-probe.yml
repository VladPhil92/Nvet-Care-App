name: Staging Railway Credential Probe

on:
  push:
    branches:
      - ops/staging-railway-probe-20260830
    paths:
      - '.github/workflows/staging-railway-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    name: Inspect staging deployment diagnostics schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_GRAPHQL_URL: https://backboard.railway.com/graphql/v2
      STAGING_ENVIRONMENT_ID: 9267d965-e5e4-4c6f-af93-001c73cf62b4
      STAGING_BACKEND_SERVICE_ID: dc5c2eee-3f8d-4416-8854-a921ea694735
    steps:
      - name: Require workspace token
        run: test -n "$RAILWAY_API_TOKEN"

      - name: Introspect deployment and log query contract
        run: |
          set -euo pipefail
          query='query Schema { __schema { queryType { fields { name args { name type { kind name ofType { kind name ofType { kind name } } } } type { kind name ofType { kind name ofType { kind name } } } } } types { kind name fields { name type { kind name ofType { kind name ofType { kind name } } } } inputFields { name type { kind name ofType { kind name ofType { kind name } } } } } } }'
          payload="$(jq -cn --arg q "$query" '{query:$q}')"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RAILWAY_API_TOKEN" -H 'Content-Type: application/json' \
            --data "$payload" "$RAILWAY_GRAPHQL_URL" >/tmp/schema.json
          jq -e '.errors == null' /tmp/schema.json >/dev/null || { jq '.errors' /tmp/schema.json; exit 1; }

          echo 'Deployment/log query signatures:'
          jq -r '
            .data.__schema.queryType.fields[]
            | select(.name | test("deployment|log|serviceInstance"; "i"))
            | [.name, (.args | map(.name + ":" + ((.type.name // .type.ofType.name // .type.ofType.ofType.name) // "?")) | join(",")), ((.type.name // .type.ofType.name // .type.ofType.ofType.name) // "?")]
            | @tsv
          ' /tmp/schema.json | sort

          echo 'Relevant input/object types:'
          jq -r '
            .data.__schema.types[]
            | select(.name | test("Deployment|Log|ServiceInstance"; "i"))
            | "TYPE \(.kind) \(.name)",
              (.inputFields[]? | "  IN \(.name):\(.type.name // .type.ofType.name // .type.ofType.ofType.name)"),
              (.fields[]? | "  OUT \(.name):\(.type.name // .type.ofType.name // .type.ofType.ofType.name)")
          ' /tmp/schema.json

      - name: Publish diagnostics summary
        run: |
          {
            echo '## Live staging diagnostics schema'
            echo ''
            echo '- Read-only Railway Public API introspection completed.'
            echo '- No environment, service, deployment, variable, domain, volume, or production resource was mutated.'
          } >> "$GITHUB_STEP_SUMMARY"
