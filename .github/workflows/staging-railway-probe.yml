name: Staging Railway Credential Probe

on:
  push:
    branches:
      - ops/staging-railway-probe-20260830
    paths:
      - '.github/workflows/staging-railway-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    name: Compare production and staging Railway config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_GRAPHQL_URL: https://backboard.railway.com/graphql/v2
      PRODUCTION_ENVIRONMENT_ID: 7f93c67e-5a63-4aae-80b6-90979a9b60b1
      PRODUCTION_BACKEND_SERVICE_ID: 42e734a0-931b-45c8-a091-4334b54e9d1c
      STAGING_ENVIRONMENT_ID: 9267d965-e5e4-4c6f-af93-001c73cf62b4
      STAGING_BACKEND_SERVICE_ID: dc5c2eee-3f8d-4416-8854-a921ea694735
    steps:
      - name: Require workspace token
        run: test -n "$RAILWAY_API_TOKEN"

      - name: Read both service instances
        run: |
          set -euo pipefail
          query='query Instance($environmentId: String!, $serviceId: String!) { serviceInstance(environmentId: $environmentId, serviceId: $serviceId) { id serviceName builder dockerfilePath railwayConfigFile rootDirectory startCommand preDeployCommand healthcheckPath healthcheckTimeout restartPolicyType restartPolicyMaxRetries source { repo image } latestDeployment { id status createdAt updatedAt } } }'
          fetch_instance() {
            local env_id="$1" service_id="$2" output="$3"
            payload="$(jq -cn --arg q "$query" --arg env "$env_id" --arg svc "$service_id" '{query:$q,variables:{environmentId:$env,serviceId:$svc}}')"
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $RAILWAY_API_TOKEN" -H 'Content-Type: application/json' \
              --data "$payload" "$RAILWAY_GRAPHQL_URL" >"$output"
            jq -e '.errors == null and .data.serviceInstance != null' "$output" >/dev/null || { jq . "$output"; exit 1; }
          }
          fetch_instance "$PRODUCTION_ENVIRONMENT_ID" "$PRODUCTION_BACKEND_SERVICE_ID" /tmp/prod.json
          fetch_instance "$STAGING_ENVIRONMENT_ID" "$STAGING_BACKEND_SERVICE_ID" /tmp/staging.json
          echo 'PRODUCTION canonical instance:'
          jq '.data.serviceInstance' /tmp/prod.json
          echo 'STAGING current instance:'
          jq '.data.serviceInstance' /tmp/staging.json

      - name: Publish read-only comparison
        run: |
          {
            echo '## Railway configuration comparison'
            echo ''
            echo '- Production and staging service-instance deployment fields were read through the Railway Public API.'
            echo '- No mutation was executed.'
          } >> "$GITHUB_STEP_SUMMARY"
