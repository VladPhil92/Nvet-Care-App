name: Staging Railway Credential Probe

on:
  push:
    branches:
      - ops/staging-railway-probe-20260830
    paths:
      - '.github/workflows/staging-railway-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    name: Probe Railway workspace Public API read-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      TARGET_PROJECT_ID: 61c97ce7-fd4d-4d8d-9e28-8c0ef964d8cd
      RAILWAY_GRAPHQL_URL: https://backboard.railway.com/graphql/v2
    steps:
      - name: Verify credential and project
        run: |
          set -euo pipefail
          test -n "$RAILWAY_API_TOKEN" || { echo '::error::Missing RAILWAY_API_TOKEN'; exit 78; }
          payload="$(jq -cn --arg id "$TARGET_PROJECT_ID" '{query:"query Project($id: String!) { project(id: $id) { id name } }",variables:{id:$id}}')"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RAILWAY_API_TOKEN" -H 'Content-Type: application/json' \
            --data "$payload" "$RAILWAY_GRAPHQL_URL" >/tmp/project.json
          jq -e --arg id "$TARGET_PROJECT_ID" '.data.project.id == $id' /tmp/project.json >/dev/null || { jq . /tmp/project.json; exit 2; }
          echo "Canonical project: $(jq -r '.data.project.name' /tmp/project.json)"

      - name: Inspect exact provisioning schema
        run: |
          set -euo pipefail
          query='query Schema { __schema { queryType { fields { name type { kind name ofType { kind name ofType { kind name } } } } } mutationType { fields { name type { kind name ofType { kind name ofType { kind name } } } args { name type { kind name ofType { kind name ofType { kind name } } } } } } types { kind name fields { name type { kind name ofType { kind name ofType { kind name } } } } inputFields { name defaultValue type { kind name ofType { kind name ofType { kind name } } } } } } }'
          payload="$(jq -cn --arg q "$query" '{query:$q}')"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RAILWAY_API_TOKEN" -H 'Content-Type: application/json' \
            --data "$payload" "$RAILWAY_GRAPHQL_URL" >/tmp/schema.json
          jq -e '.errors == null' /tmp/schema.json >/dev/null || { jq '.errors' /tmp/schema.json; exit 1; }

          echo 'INPUT ServiceSourceInput:'
          jq -r '.data.__schema.types[] | select(.name=="ServiceSourceInput") | .inputFields[] | "  \(.name):\(.type.name // .type.ofType.name // .type.ofType.ofType.name)"' /tmp/schema.json
          echo 'INPUT ServiceCreateInput:'
          jq -r '.data.__schema.types[] | select(.name=="ServiceCreateInput") | .inputFields[] | "  \(.name):\(.type.name // .type.ofType.name // .type.ofType.ofType.name)"' /tmp/schema.json
          echo 'INPUT EnvironmentCreateInput:'
          jq -r '.data.__schema.types[] | select(.name=="EnvironmentCreateInput") | .inputFields[] | "  \(.name):\(.type.name // .type.ofType.name // .type.ofType.ofType.name)"' /tmp/schema.json
          echo 'INPUT VolumeCreateInput:'
          jq -r '.data.__schema.types[] | select(.name=="VolumeCreateInput") | .inputFields[] | "  \(.name):\(.type.name // .type.ofType.name // .type.ofType.ofType.name)"' /tmp/schema.json
          echo 'INPUT ServiceDomainCreateInput:'
          jq -r '.data.__schema.types[] | select(.name=="ServiceDomainCreateInput") | .inputFields[] | "  \(.name):\(.type.name // .type.ofType.name // .type.ofType.ofType.name)"' /tmp/schema.json
          echo 'INPUT VariableCollectionUpsertInput:'
          jq -r '.data.__schema.types[] | select(.name=="VariableCollectionUpsertInput") | .inputFields[] | "  \(.name):\(.type.name // .type.ofType.name // .type.ofType.ofType.name)"' /tmp/schema.json
          echo 'INPUT ServiceInstanceUpdateInput:'
          jq -r '.data.__schema.types[] | select(.name=="ServiceInstanceUpdateInput") | .inputFields[] | "  \(.name):\(.type.name // .type.ofType.name // .type.ofType.ofType.name)"' /tmp/schema.json

          echo 'QUERY templateSearch return type:'
          jq -r '.data.__schema.queryType.fields[] | select(.name=="templateSearch") | .type | tostring' /tmp/schema.json
          echo 'Template-related object types:'
          jq -r '.data.__schema.types[] | select(.kind=="OBJECT" and (.name|test("Template"))) | "TYPE \(.name)", (.fields[]? | "  \(.name):\(.type.name // .type.ofType.name // .type.ofType.ofType.name)")' /tmp/schema.json

          echo 'Mutation return types:'
          jq -r '.data.__schema.mutationType.fields[] | select(.name=="environmentCreate" or .name=="serviceCreate" or .name=="serviceDomainCreate" or .name=="variableCollectionUpsert" or .name=="volumeCreate" or .name=="serviceInstanceDeployV2" or .name=="serviceInstanceUpdate") | "\(.name):\(.type.name // .type.ofType.name // .type.ofType.ofType.name)"' /tmp/schema.json

      - name: Publish probe summary
        if: always()
        run: |
          {
            echo '## Railway Public API provisioning schema probe'
            echo ''
            echo '- Workspace token can read the canonical Nvet project.'
            echo '- Exact service/source/volume/domain/variable input contracts inspected.'
            echo '- No Railway mutation was executed.'
          } >> "$GITHUB_STEP_SUMMARY"
