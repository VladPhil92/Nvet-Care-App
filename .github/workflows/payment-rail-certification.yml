name: Nvet Transfer Payment Rail Certification

on:
  workflow_run:
    workflows: ['Staging E2E Seed & Preflight']
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: nvet-transfer-payment-rail-certification
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'
  RAILWAY_PROJECT_ID: 61c97ce7-fd4d-4d8d-9e28-8c0ef964d8cd
  RAILWAY_STAGING_ENVIRONMENT_ID: 9267d965-e5e4-4c6f-af93-001c73cf62b4
  RAILWAY_STAGING_SERVICE_ID: dc5c2eee-3f8d-4416-8854-a921ea694735
  RAILWAY_PRODUCTION_SERVICE_ID: 42e734a0-931b-45c8-a091-4334b54e9d1c

jobs:
  certify-transfer:
    name: Certify CLIENT → VET → ADMIN transfer lifecycle
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RC_CANDIDATE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      NVET_PAYMENT_CERTIFICATION_TARGET: staging
      RECOVERY_WAIT_TIMEOUT_MS: '1200000'
      RECOVERY_POLL_INTERVAL_MS: '15000'

    steps:
      - name: Checkout certified candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RC_CANDIDATE_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Require exact candidate recovery rehearsal
        run: node scripts/wait-for-recovery-readiness.mjs

      - name: Load current Railway staging certification session
        run: node scripts/railway-staging-session.mjs load

      - name: Verify staging still serves the certified candidate
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          code="$(curl --silent --show-error --location --max-time 15 --output "$tmp" --write-out '%{http_code}' "${E2E_API_URL%/}/health/ready")"
          test "$code" = '200'
          node - "$tmp" "$RC_CANDIDATE_SHA" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const expected = process.argv[3].slice(0, 12).toLowerCase();
          const revision = String(body?.revision || '').toLowerCase();
          if (body?.status !== 'ok' || body?.checks?.database?.status !== 'up' || !revision.startsWith(expected)) {
            console.error(`Staging candidate mismatch: expected ${expected}, received ${body?.revision ?? 'missing'}`);
            process.exit(1);
          }
          console.log(`Staging is still serving certified candidate ${body.revision}.`);
          NODE

      - name: Certify private staging transfer lifecycle
        run: node scripts/certify-transfer-payment-rail-v2.mjs

      - name: Publish certification boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## Nvet TRANSFER Payment Rail Certification v2'
            echo ''
            echo "- Candidate: \`${RC_CANDIDATE_SHA}\`"
            echo '- Recovery prerequisite: exact-candidate Nvet Recovery Readiness must complete successfully before transaction certification begins.'
            echo '- Target: isolated Railway staging only.'
            echo '- Credentials: loaded from the runtime-rotated Railway staging session and masked in Actions.'
            echo '- Required identities: CLIENT → verified VET → ADMIN.'
            echo '- Required transaction lifecycle: PENDING → VERIFYING → CONFIRMED.'
            echo '- Transfer evidence must be private, readable only through the authenticated admin endpoint and SHA-256 identical to the submitted proof.'
            echo '- Private storage identifiers and legacy TRANSFER hashOnchain values must not appear in VET, ADMIN confirmation or CLIENT responses.'
            echo '- The synthetic appointment is cancelled after certification to release availability.'
            echo ''
            echo '> A successful run proves the Nvet application rail after an exact-candidate logical recovery rehearsal. It does not prove that real funds moved through a bank. Keep `paymentRailVerified` pending until a controlled real transfer is retained as operator evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
