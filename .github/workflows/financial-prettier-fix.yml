name: Financial Prettier Fix

on:
  push:
    branches:
      - feat/financial-production-convergence

permissions:
  contents: write

concurrency:
  group: financial-prettier-fix
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/financial-production-convergence
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=dev --legacy-peer-deps
      - name: Format financial convergence files
        run: |
          npx prettier --write \
            backend/src/common/interceptors/financial-privacy.interceptor.ts \
            backend/src/payments/dto/payment.dto.ts \
            backend/src/payments/financial-data-crypto.service.ts \
            backend/src/payments/financial-operations.service.ts \
            backend/src/payments/payments.controller.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/common/interceptors/financial-privacy.interceptor.ts \
            backend/src/payments/dto/payment.dto.ts \
            backend/src/payments/financial-data-crypto.service.ts \
            backend/src/payments/financial-operations.service.ts \
            backend/src/payments/payments.controller.ts
          git commit -m 'style(finance): apply canonical prettier formatting'
          git push origin HEAD:feat/financial-production-convergence
