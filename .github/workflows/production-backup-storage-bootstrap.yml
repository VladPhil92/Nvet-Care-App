name: Nvet Production Backup Storage Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-backup-storage-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvet-production-backup-storage-bootstrap
  cancel-in-progress: false

env:
  RAILWAY_PROJECT_ID: 61c97ce7-fd4d-4d8d-9e28-8c0ef964d8cd
  RAILWAY_PRODUCTION_ENVIRONMENT_ID: 7f93c67e-5a63-4aae-80b6-90979a9b60b1
  BACKUP_BUCKET_NAME: nvet-production-backups
  BACKUP_BUCKET_REGION: ams

jobs:
  bootstrap-storage:
    name: Ensure production backup storage bucket exists
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 8
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_CREDENTIAL: ${{ secrets.RAILWAY_API_TOKEN }}

    steps:
      - name: Validate Railway credential
        shell: sh
        run: |
          set -eu
          if [ -z "${RAILWAY_CREDENTIAL:-}" ]; then
            echo '::error::Railway credential is required.'
            exit 1
          fi

      - name: Resolve Railway credential mode and target canonical production
        shell: sh
        run: |
          set -eu

          if RAILWAY_API_TOKEN="$RAILWAY_CREDENTIAL" RAILWAY_TOKEN='' railway link \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_PRODUCTION_ENVIRONMENT_ID" \
            --json >/tmp/railway-link.json 2>/tmp/railway-api-token.err; then
            echo 'RAILWAY_AUTH_MODE=api' >> "$GITHUB_ENV"
            echo 'Railway credential accepted as account/API token.'
          elif RAILWAY_TOKEN="$RAILWAY_CREDENTIAL" RAILWAY_API_TOKEN='' railway bucket \
            --environment "$RAILWAY_PRODUCTION_ENVIRONMENT_ID" list --json \
            >/tmp/railway-project-buckets.json 2>/tmp/railway-project-token.err; then
            echo 'RAILWAY_AUTH_MODE=project' >> "$GITHUB_ENV"
            echo 'Railway credential accepted as project token.'
          else
            echo '::error::Railway credential was rejected in both account-token and project-token modes.'
            sed -n '1,3p' /tmp/railway-api-token.err || true
            sed -n '1,3p' /tmp/railway-project-token.err || true
            exit 1
          fi

      - name: Ensure backup bucket
        id: bucket
        shell: sh
        run: |
          set -eu

          railway_bucket() {
            if [ "$RAILWAY_AUTH_MODE" = 'api' ]; then
              RAILWAY_API_TOKEN="$RAILWAY_CREDENTIAL" RAILWAY_TOKEN='' railway bucket \
                --environment "$RAILWAY_PRODUCTION_ENVIRONMENT_ID" "$@"
            else
              RAILWAY_TOKEN="$RAILWAY_CREDENTIAL" RAILWAY_API_TOKEN='' railway bucket \
                --environment "$RAILWAY_PRODUCTION_ENVIRONMENT_ID" "$@"
            fi
          }

          railway_bucket list > /tmp/railway-buckets-before.txt
          if grep -Fq "$BACKUP_BUCKET_NAME" /tmp/railway-buckets-before.txt; then
            echo 'created=false' >> "$GITHUB_OUTPUT"
            echo 'Backup bucket already exists.'
          else
            railway_bucket create "$BACKUP_BUCKET_NAME" --region "$BACKUP_BUCKET_REGION"
            echo 'created=true' >> "$GITHUB_OUTPUT"
          fi

          railway_bucket list > /tmp/railway-buckets-after.txt
          if ! grep -Fq "$BACKUP_BUCKET_NAME" /tmp/railway-buckets-after.txt; then
            echo '::error::Backup bucket is not visible after bootstrap.'
            exit 1
          fi

      - name: Publish bootstrap evidence
        if: always()
        shell: sh
        run: |
          {
            echo '## Nvet Production Backup Storage Bootstrap'
            echo ''
            echo '- Project: Nvet Care App'
            echo '- Environment: production'
            echo "- Bucket: $BACKUP_BUCKET_NAME"
            echo "- Region: $BACKUP_BUCKET_REGION"
            echo "- Auth mode resolved: ${RAILWAY_AUTH_MODE:-unresolved}"
            echo "- Created in this run: ${{ steps.bucket.outputs.created || 'unknown' }}"
            echo ''
            echo '> Account tokens link explicitly to the canonical project/environment. Project tokens already identify their project and target production directly through the bucket command.'
            echo '> This workflow only ensures the isolated S3-compatible backup bucket exists. It does not read or restore production data and does not print bucket credentials.'
          } >> "$GITHUB_STEP_SUMMARY"
