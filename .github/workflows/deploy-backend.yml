# Deploy Backend → Railway
#
# Despliega el backend NestJS a Railway en cada push a main o manualmente.
# La validación replica el baseline de CI y las migraciones manuales idempotentes
# se aplican antes de publicar código que dependa de ellas.
name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Saltar tests (solo para hotfixes urgentes)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.x'

jobs:
  validate:
    name: Validate before deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub?schema=public

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: npm test -- --ci --maxWorkers=2

  migrate:
    name: Apply production DB guards
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Prisma runtime
        run: npm install --no-audit --no-fund

      - name: Apply booking integrity guard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma db execute --file prisma/migrations/manual/booking_integrity_v1.sql --schema prisma/schema.prisma

      - name: Apply appointment live-location storage
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma db execute --file prisma/migrations/manual/live_location_v1.sql --schema prisma/schema.prisma

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [validate, migrate]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service ${{ secrets.RAILWAY_SERVICE_ID }} \
            --detach

      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Health check post-deploy
        env:
          BACKEND_URL: ${{ secrets.BACKEND_PROD_URL }}
        run: |
          BACKEND_URL="${BACKEND_URL:-https://api.nvetcare.co}"
          MAX_ATTEMPTS=10
          ATTEMPT=0
          until curl -sf "$BACKEND_URL/api/health/ready" > /dev/null; do
            ATTEMPT=$((ATTEMPT+1))
            if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
              echo "❌ Health check falló después de $MAX_ATTEMPTS intentos"
              echo "URL: $BACKEND_URL/api/health/ready"
              exit 1
            fi
            echo "Intento $ATTEMPT/$MAX_ATTEMPTS - esperando..."
            sleep 10
          done
          echo "✅ Backend saludable: $BACKEND_URL/api/health/ready"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Deploy backend FALLÓ - ${new Date().toISOString()}`,
              body: `El deploy del backend a Railway falló.\n\n**Commit**: ${context.sha}\n**Branch**: ${context.ref}\n**Actor**: ${context.actor}\n\n[Ver log del workflow](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['bug', 'deploy-failure']
            })
