# Manual Railway recovery / diagnostics workflow.
#
# Production deploys are owned by Railway's native GitHub autodeploy.
# This workflow MUST NOT create a second deploy on every push to main.
# It exists only for an operator-initiated recovery or inspection when a
# RAILWAY_TOKEN and RAILWAY_SERVICE_ID have been configured in GitHub.
name: Railway Recovery (Manual)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Railway operation'
        required: true
        default: 'inspect'
        type: choice
        options:
          - inspect
          - canonicalize-root
          - redeploy

env:
  NODE_VERSION: '22.x'

jobs:
  repository-contract:
    name: Verify canonical backend contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify Railway runtime scripts
        run: |
          node --check backend/scripts/production-predeploy.mjs
          node --check backend/scripts/railway-runtime-smoke.mjs
          node - <<'NODE'
          const root = require('./package.json');
          const backend = require('./backend/package.json');
          if (!Array.isArray(root.workspaces) || !root.workspaces.includes('backend')) {
            throw new Error('backend must remain an npm workspace from repository root');
          }
          if (backend.scripts?.['railway:start'] !== 'npm run deploy:preflight && node scripts/railway-runtime-smoke.mjs') {
            throw new Error('backend railway:start must run safe schema preflight before runtime smoke');
          }
          if (backend.scripts?.['deploy:preflight'] !== 'node scripts/production-predeploy.mjs') {
            throw new Error('backend deploy:preflight contract drifted');
          }
          NODE

  railway:
    name: Railway operator action
    runs-on: ubuntu-latest
    needs: repository-contract
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
    steps:
      - name: Require Railway operator credentials
        run: |
          test -n "$RAILWAY_TOKEN" || {
            echo '❌ GitHub secret RAILWAY_TOKEN is not configured.'
            echo 'This workflow is intentionally manual; native Railway GitHub autodeploy remains production source of truth.'
            exit 1
          }
          test -n "$RAILWAY_SERVICE_ID" || {
            echo '❌ GitHub secret RAILWAY_SERVICE_ID is not configured.'
            exit 1
          }

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Inspect current Railway environment
        if: ${{ inputs.operation == 'inspect' }}
        run: |
          railway environment config --json || true
          railway deployment list --service "$RAILWAY_SERVICE_ID" --limit 5

      - name: Set canonical monorepo root
        if: ${{ inputs.operation == 'canonicalize-root' }}
        run: |
          railway environment edit \
            --yes \
            --message "Nvet canonical shared-workspace root is repository /" \
            --service-config "$RAILWAY_SERVICE_ID" source.rootDirectory /
          echo '✅ Railway source.rootDirectory staged/applied as /'

      - name: Redeploy current source
        if: ${{ inputs.operation == 'redeploy' }}
        run: railway redeploy --service "$RAILWAY_SERVICE_ID" --yes

      - name: Show latest deployment
        if: ${{ inputs.operation != 'inspect' }}
        run: railway deployment list --service "$RAILWAY_SERVICE_ID" --limit 3
