name: Phase 11E Railway Failure Diagnostics

on:
  push:
    branches:
      - feat/autonomous-staging-certification-20260901
    paths:
      - '.github/workflows/phase-11e-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      DEPLOYMENT_ID: f487f0ea-5b10-4d50-ad46-022037144e28
    steps:
      - name: Read failed deployment logs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const response = await fetch('https://backboard.railway.com/graphql/v2', {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.RAILWAY_API_TOKEN}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              query: `query Diagnose($deploymentId: String!) {
                deployment(id: $deploymentId) { id status }
                buildLogs(deploymentId: $deploymentId, limit: 200) { timestamp message severity }
                deploymentLogs(deploymentId: $deploymentId, limit: 200) { timestamp message severity }
              }`,
              variables: { deploymentId: process.env.DEPLOYMENT_ID },
            }),
          });
          const payload = await response.json();
          if (!response.ok || payload.errors?.length) {
            throw new Error(payload.errors?.map((e) => e.message).join('; ') || `HTTP ${response.status}`);
          }
          console.log(`DEPLOYMENT ${payload.data.deployment.id} STATUS ${payload.data.deployment.status}`);
          console.log('--- BUILD LOGS ---');
          for (const row of payload.data.buildLogs ?? []) console.log(`${row.timestamp ?? ''} [${row.severity ?? ''}] ${row.message ?? ''}`);
          console.log('--- DEPLOYMENT LOGS ---');
          for (const row of payload.data.deploymentLogs ?? []) console.log(`${row.timestamp ?? ''} [${row.severity ?? ''}] ${row.message ?? ''}`);
          NODE
