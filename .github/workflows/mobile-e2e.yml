# Detox E2E workflow para mobile.
#
# Android es la plataforma nativa activa. iOS queda disponible manualmente
# cuando exista el scaffold `mobile/ios`; los nightly no deben simular soporte
# iOS antes de que esa plataforma esté incorporada al repositorio.
name: Mobile E2E

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plataforma a probar'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - both
      record_videos:
        description: 'Grabar video de cada test'
        required: false
        default: false
        type: boolean
  schedule:
    # Nightly 08:00 UTC = 03:00 Bogotá. Mientras iOS no exista, corre Android.
    - cron: '0 8 * * *'

env:
  NODE_VERSION: '22.x'

jobs:
  e2e-ios:
    name: E2E iOS (iPhone 15 simulator)
    if: |
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both')
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require committed iOS native project
        run: |
          test -d mobile/ios || {
            echo '::error::mobile/ios todavía no existe. La Fase 2 iOS debe incorporar el proyecto nativo antes de habilitar este E2E.'
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install canonical workspace dependencies
        run: npm ci --include=dev --legacy-peer-deps

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('mobile/ios/Podfile.lock') }}

      - name: Install pods
        working-directory: mobile/ios
        run: pod install --repo-update

      - name: Install Detox iOS helpers
        run: |
          npm install -g detox-cli
          brew tap wix/brew
          brew install applesimutils

      - name: Build app for Detox
        working-directory: mobile
        run: npm run e2e:build:ios

      - name: Run Detox tests
        working-directory: mobile
        env:
          DETOX_RECORD_VIDEOS: ${{ github.event.inputs.record_videos == 'true' && '1' || '0' }}
          E2E_API_URL: ${{ secrets.E2E_API_URL || 'http://localhost:3000' }}
          E2E_CLIENT_EMAIL: ${{ secrets.E2E_CLIENT_EMAIL }}
          E2E_CLIENT_PASSWORD: ${{ secrets.E2E_CLIENT_PASSWORD }}
          E2E_VET_EMAIL: ${{ secrets.E2E_VET_EMAIL }}
          E2E_VET_PASSWORD: ${{ secrets.E2E_VET_PASSWORD }}
        run: npm run e2e:test:ios -- --headless --record-logs all

      - name: Upload Detox artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detox-artifacts-ios
          path: mobile/.detox-artifacts
          retention-days: 14

  e2e-android:
    name: E2E Android (Pixel 6 emulator)
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.platform == 'android' ||
      github.event.inputs.platform == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install canonical workspace dependencies
        run: npm ci --include=dev --legacy-peer-deps

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/**/gradle-wrapper.properties') }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run E2E with emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_API_URL: ${{ secrets.E2E_API_URL || 'http://localhost:3000' }}
          E2E_CLIENT_EMAIL: ${{ secrets.E2E_CLIENT_EMAIL }}
          E2E_CLIENT_PASSWORD: ${{ secrets.E2E_CLIENT_PASSWORD }}
          E2E_VET_EMAIL: ${{ secrets.E2E_VET_EMAIL }}
          E2E_VET_PASSWORD: ${{ secrets.E2E_VET_PASSWORD }}
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: mobile
          script: |
            npm run e2e:build:android
            npm run e2e:test:android -- --headless --record-logs all

      - name: Upload Detox artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detox-artifacts-android
          path: mobile/.detox-artifacts
          retention-days: 14
