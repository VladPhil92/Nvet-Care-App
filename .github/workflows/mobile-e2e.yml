# Detox E2E workflow para mobile.
#
# Ejecuta los 3 specs E2E (login-search-book-pay, vet-receives-appointment,
# chat-reconnect) en un simulador iOS y opcionalmente en un emulador Android.
#
# Triggers:
#   - workflow_dispatch (botón manual en GitHub UI)
#   - schedule: nightly (08:00 UTC = 03:00 Bogotá), solo si DETOX_NIGHTLY=true
#   - Comentario "/e2e" en un PR (handled vía workflow_dispatch desde otra acción)
#
# Notas:
#   - macos-latest tiene Xcode + simulators preinstalados
#   - El job android usa ubuntu con KVM acceleration via reactivecircus/android-emulator-runner
#   - Los timings son agresivos pero realistas para CI con cache caliente
#   - Si Detox falla por timeout, los artifacts (.detox-artifacts) se suben para postmortem
name: Mobile E2E

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plataforma a probar'
        required: true
        default: 'ios'
        type: choice
        options:
          - ios
          - android
          - both
      record_videos:
        description: 'Grabar video de cada test'
        required: false
        default: false
        type: boolean
  schedule:
    # Nightly 08:00 UTC = 03:00 Bogotá
    - cron: '0 8 * * *'

env:
  NODE_VERSION: '20.x'

jobs:
  e2e-ios:
    name: E2E iOS (iPhone 15 simulator)
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.platform == 'ios' ||
      github.event.inputs.platform == 'both'
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('mobile/ios/Podfile.lock') }}

      - name: Install pods
        run: cd ios && pod install --repo-update

      - name: Install detox-cli + applesimutils
        run: |
          npm install -g detox-cli
          brew tap wix/brew
          brew install applesimutils

      - name: Build app for Detox
        run: npm run e2e:build:ios

      - name: Run Detox tests
        env:
          DETOX_RECORD_VIDEOS: ${{ github.event.inputs.record_videos == 'true' && '1' || '0' }}
          E2E_API_URL: ${{ secrets.E2E_API_URL || 'http://localhost:3000' }}
          E2E_CLIENT_EMAIL: ${{ secrets.E2E_CLIENT_EMAIL }}
          E2E_CLIENT_PASSWORD: ${{ secrets.E2E_CLIENT_PASSWORD }}
          E2E_VET_EMAIL: ${{ secrets.E2E_VET_EMAIL }}
          E2E_VET_PASSWORD: ${{ secrets.E2E_VET_PASSWORD }}
        run: npm run e2e:test:ios -- --headless --record-logs all

      - name: Upload Detox artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detox-artifacts-ios
          path: mobile/.detox-artifacts
          retention-days: 14

  e2e-android:
    name: E2E Android (Pixel 6 emulator)
    if: |
      github.event.inputs.platform == 'android' ||
      github.event.inputs.platform == 'both'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/**/gradle-wrapper.properties') }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run E2E with emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_API_URL: ${{ secrets.E2E_API_URL || 'http://localhost:3000' }}
          E2E_CLIENT_EMAIL: ${{ secrets.E2E_CLIENT_EMAIL }}
          E2E_CLIENT_PASSWORD: ${{ secrets.E2E_CLIENT_PASSWORD }}
          E2E_VET_EMAIL: ${{ secrets.E2E_VET_EMAIL }}
          E2E_VET_PASSWORD: ${{ secrets.E2E_VET_PASSWORD }}
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: mobile
          script: |
            npm run e2e:build:android
            npm run e2e:test:android -- --headless --record-logs all

      - name: Upload Detox artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detox-artifacts-android
          path: mobile/.detox-artifacts
          retention-days: 14
