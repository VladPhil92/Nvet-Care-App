name: Beta Web Convergence

on:
  pull_request:
    paths:
      - 'backend/src/beta/**'
      - 'docs/CTG_ONE_INTEGRATION.md'
      - 'docs/PHASE_12G_CANONICAL_BETA_OPERATIONS_CONVERGENCE.md'
      - 'docs/production/BETA_WEB_CONVERGENCE.json'
      - 'scripts/verify-beta-web-convergence.mjs'
      - '.github/workflows/beta-web-convergence.yml'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - 'backend/src/beta/**'
      - 'docs/CTG_ONE_INTEGRATION.md'
      - 'docs/PHASE_12G_CANONICAL_BETA_OPERATIONS_CONVERGENCE.md'
      - 'docs/production/BETA_WEB_CONVERGENCE.json'
      - 'scripts/verify-beta-web-convergence.mjs'
      - '.github/workflows/beta-web-convergence.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  contract:
    name: Canonical Beta Web Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Verify Phase 12G contract
        run: node scripts/verify-beta-web-convergence.mjs
