name: Temporary Auth Refresh JTI Patch

on:
  push:
    branches:
      - fix/auth-unique-refresh-session-jti

permissions:
  contents: write

jobs:
  patch-auth:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v7
        with:
          ref: fix/auth-unique-refresh-session-jti
          fetch-depth: 0

      - name: Apply exact refresh-token uniqueness patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/src/auth/auth.service.ts')
          source = path.read_text()
          old = '''  private async signRefreshToken(user: any): Promise<string> {
              return this.jwtService.signAsync(
                { sub: user.id, type: "refresh" },
                {
          '''
          # Preserve the repository's exact indentation while changing only the
          # refresh JWT payload. The fallback handles the canonical two-space form.
          canonical = '''  private async signRefreshToken(user: any): Promise<string> {
              return this.jwtService.signAsync(
                { sub: user.id, type: "refresh" },
                {
          '''
          exact = '''  private async signRefreshToken(user: any): Promise<string> {
            return this.jwtService.signAsync(
              { sub: user.id, type: "refresh" },
              {
          '''
          replacement = '''  private async signRefreshToken(user: any): Promise<string> {
            return this.jwtService.signAsync(
              { sub: user.id, type: "refresh", jti: crypto.randomUUID() },
              {
          '''

          if 'jti: crypto.randomUUID()' not in source:
              if exact not in source:
                  raise SystemExit('Expected signRefreshToken block was not found; refusing broad rewrite')
              source = source.replace(exact, replacement, 1)
              path.write_text(source)
          PY

          cat > backend/src/auth/auth.service.refresh-jti.spec.ts <<'EOF'
          import { AuthService } from './auth.service';

          describe('AuthService refresh-token issuance uniqueness', () => {
            let service: AuthService;
            let jwtService: { signAsync: jest.Mock };

            beforeEach(() => {
              jwtService = {
                signAsync: jest.fn().mockImplementation(async (payload) =>
                  JSON.stringify(payload),
                ),
              };

              service = new AuthService(
                {} as any,
                jwtService as any,
                {} as any,
                {} as any,
                { log: jest.fn() } as any,
                {} as any,
              );
            });

            it('adds a distinct UUID jti to every refresh token emission', async () => {
              const user = { id: 'same-user' };
              const signRefreshToken = (service as any).signRefreshToken.bind(service);

              const first = await signRefreshToken(user);
              const second = await signRefreshToken(user);

              expect(first).not.toBe(second);
              expect(jwtService.signAsync).toHaveBeenCalledTimes(2);

              const firstPayload = jwtService.signAsync.mock.calls[0][0];
              const secondPayload = jwtService.signAsync.mock.calls[1][0];

              expect(firstPayload).toEqual(
                expect.objectContaining({
                  sub: 'same-user',
                  type: 'refresh',
                  jti: expect.any(String),
                }),
              );
              expect(secondPayload).toEqual(
                expect.objectContaining({
                  sub: 'same-user',
                  type: 'refresh',
                  jti: expect.any(String),
                }),
              );
              expect(firstPayload.jti).not.toBe(secondPayload.jti);
              expect(firstPayload.jti).toMatch(
                /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i,
              );
              expect(secondPayload.jti).toMatch(
                /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i,
              );
            });
          });
          EOF

      - name: Commit patched auth source and regression test
        shell: bash
        run: |
          set -euo pipefail
          git add backend/src/auth/auth.service.ts backend/src/auth/auth.service.refresh-jti.spec.ts
          if git diff --cached --quiet; then
            echo 'Patch already applied; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(auth): make every refresh session token unique'
          git push origin HEAD:fix/auth-unique-refresh-session-jti
