name: Android Public Release Contract

on:
  push:
    branches: ['**']
    paths:
      - 'mobile/android/**'
      - 'mobile/package.json'
      - 'scripts/android-public-release-convergence-gate.mjs'
      - '.github/workflows/android-public-release.yml'
      - '.github/workflows/android-public-release-contract.yml'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - 'mobile/package.json'
      - 'scripts/android-public-release-convergence-gate.mjs'
      - '.github/workflows/android-public-release.yml'
      - '.github/workflows/android-public-release-contract.yml'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: android-public-release-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Android public release convergence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Validate public release contract
        run: node scripts/android-public-release-convergence-gate.mjs

      - name: Syntax-check release workflow guard inputs
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "NVET_ANDROID_REQUIRE_SIGNING: 'true'" .github/workflows/android-public-release.yml
          grep -Fq "if: github.ref == 'refs/heads/main'" .github/workflows/android-public-release.yml
          grep -Fq 'jarsigner -verify -strict' .github/workflows/android-public-release.yml
