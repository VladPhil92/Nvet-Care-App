name: Nvet Real Device Pilot Phase 47

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PILOT-REAL-DEVICE to build the signed physical-test APK'
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  NODE_VERSION: '22.x'
  NVET_API_URL: 'https://backend-production-a476.up.railway.app/api'
  NVET_ANDROID_REQUIRE_SIGNING: 'true'
  NVET_ANDROID_VERSION_NAME: '1.0.0-rc.2'

jobs:
  signed-physical-pilot:
    name: Build signed physical-device pilot APK
    if: ${{ inputs.confirm == 'PILOT-REAL-DEVICE' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    steps:
      - name: Checkout release-control head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve certified candidate product SHA
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(node -p "require('./docs/production/PHASE_47_REAL_TEST_DEPLOYMENT_HANDOFF.json').candidateProductSha")"
          test "$SHA" = 'ac38256845ad9228be040e353011b2e7262b5b60'
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable certified candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install canonical dependencies
        run: npm ci --include=dev --legacy-peer-deps

      - name: Validate signing material and production map key
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          missing=''
          [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ] && missing="$missing ANDROID_KEY_PASSWORD"
          [ -z "${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}" ] && missing="$missing GOOGLE_MAPS_ANDROID_API_KEY"
          [ -z "$EXPECTED_CERT_SHA256" ] && missing="$missing ANDROID_UPLOAD_CERT_SHA256"
          if [ -n "$missing" ]; then
            echo "::error::Missing release secrets:$missing"
            exit 1
          fi

      - name: Materialize ephemeral upload keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/nvet-upload-key.jks"
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "NVET_ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Verify upload certificate fingerprint
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          ACTUAL="$(keytool -list -v -keystore "$NVET_ANDROID_KEYSTORE_FILE" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Build production-signed pilot APK
        working-directory: mobile/android
        env:
          NVET_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NVET_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NVET_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          NVET_ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and checksum
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          APK='mobile/android/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > "$APK.sha256"
          SHA256="$(cut -d' ' -f1 "$APK.sha256")"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Write pilot metadata
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          APK_SHA256: ${{ steps.artifact.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          OUT='mobile/android/app/build/outputs/apk/release'
          node - <<'NODE'
          const fs = require('fs');
          const metadata = {
            schemaVersion: 1,
            phase: 47,
            program: 'real-device-pilot',
            candidate: '1.0.0-rc.2',
            candidateSha: process.env.CANDIDATE_SHA,
            applicationId: 'com.nvetcare',
            targetSdk: 36,
            apiUrl: process.env.NVET_API_URL,
            apkSha256: process.env.APK_SHA256,
            purpose: 'controlled physical-device testing only',
            commercialLaunchAuthorized: false,
            publicStoreReleaseAuthorized: false,
            generatedAt: new Date().toISOString(),
          };
          fs.writeFileSync('mobile/android/app/build/outputs/apk/release/phase47-pilot-metadata.json', `${JSON.stringify(metadata, null, 2)}\n`);
          NODE

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: |
          if [ -n "${NVET_ANDROID_KEYSTORE_FILE:-}" ]; then rm -f "$NVET_ANDROID_KEYSTORE_FILE"; fi

      - name: Upload signed physical-test package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nvetcare-phase47-real-device-${{ github.run_number }}
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/apk/release/app-release.apk.sha256
            mobile/android/app/build/outputs/apk/release/phase47-pilot-metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: Attest pilot APK provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Pilot boundary summary
        shell: bash
        run: |
          {
            echo '## Nvet Phase 47 — signed real-device pilot'
            echo "- Candidate product SHA: \`${{ steps.candidate.outputs.sha }}\`"
            echo '- Artifact: production-signed APK for controlled sideload testing'
            echo '- API: canonical production API'
            echo '- This does not activate closed beta, verify real payments, publish to Play, or authorize commercial launch.'
          } >> "$GITHUB_STEP_SUMMARY"
