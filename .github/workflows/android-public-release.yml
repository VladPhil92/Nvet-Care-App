name: Android Public Release Bundle

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Android versionName (for example 1.0.0)
        required: true
        default: '1.0.0'
        type: string
      version_code:
        description: Monotonically increasing Google Play versionCode
        required: true
        default: '1'
        type: string

run-name: Android public release ${{ inputs.version_name }} (${{ inputs.version_code }})

permissions:
  contents: read

concurrency:
  group: android-public-release
  cancel-in-progress: false

env:
  NODE_VERSION: '22.x'
  NVET_API_URL: https://backend-production-a476.up.railway.app
  NVET_ANDROID_VERSION_NAME: ${{ inputs.version_name }}
  NVET_ANDROID_VERSION_CODE: ${{ inputs.version_code }}
  NVET_ANDROID_REQUIRE_SIGNING: 'true'

jobs:
  signed-aab:
    name: Build and attest signed Android App Bundle
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v7

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NVET_ANDROID_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$NVET_ANDROID_VERSION_CODE" =~ ^[0-9]+$ ]]
          (( NVET_ANDROID_VERSION_CODE >= 1 && NVET_ANDROID_VERSION_CODE <= 2100000000 ))

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci --include=dev --legacy-peer-deps

      - name: Validate Android public release contract
        run: node scripts/android-public-release-convergence-gate.mjs

      - name: Materialize ephemeral upload keystore
        shell: bash
        env:
          NVET_ANDROID_KEYSTORE_BASE64: ${{ secrets.NVET_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$NVET_ANDROID_KEYSTORE_BASE64"
          KEYSTORE_PATH="$RUNNER_TEMP/nvet-upload-key.jks"
          printf '%s' "$NVET_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "NVET_ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed production AAB
        working-directory: mobile/android
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          NVET_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NVET_ANDROID_KEYSTORE_PASSWORD }}
          NVET_ANDROID_KEY_ALIAS: ${{ secrets.NVET_ANDROID_KEY_ALIAS }}
          NVET_ANDROID_KEY_PASSWORD: ${{ secrets.NVET_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_MAPS_ANDROID_API_KEY"
          test -n "$NVET_ANDROID_KEYSTORE_PASSWORD"
          test -n "$NVET_ANDROID_KEY_ALIAS"
          test -n "$NVET_ANDROID_KEY_PASSWORD"
          ./gradlew clean bundleRelease --no-daemon --stacktrace

      - name: Verify signed bundle and produce checksum
        shell: bash
        env:
          NVET_ANDROID_KEY_ALIAS: ${{ secrets.NVET_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          AAB="mobile/android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -strict "$AAB"
          keytool -list -keystore "$NVET_ANDROID_KEYSTORE_FILE" -storepass "${{ secrets.NVET_ANDROID_KEYSTORE_PASSWORD }}" -alias "$NVET_ANDROID_KEY_ALIAS" >/dev/null
          sha256sum "$AAB" | tee android-release-sha256.txt
          printf 'versionName=%s\nversionCode=%s\ncommit=%s\n' \
            "$NVET_ANDROID_VERSION_NAME" "$NVET_ANDROID_VERSION_CODE" "$GITHUB_SHA" > android-release-metadata.txt

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-signed-aab
          path: |
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            android-release-sha256.txt
            android-release-metadata.txt
          if-no-files-found: error
          retention-days: 30
