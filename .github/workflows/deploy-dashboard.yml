# Deploy Dashboard → Vercel
#
# Despliega el dashboard (Vite + React) a Vercel automáticamente
# en cada push a main o manualmente con workflow_dispatch.
#
# Secrets requeridos en el repo (Settings → Secrets → Actions):
#   VERCEL_TOKEN      → Obtener en https://vercel.com/account/tokens
#   VERCEL_ORG_ID     → Valor de .vercel/project.json → "orgId"
#   VERCEL_PROJECT_ID → Valor de .vercel/project.json → "projectId"
#
# Cómo obtener VERCEL_ORG_ID y VERCEL_PROJECT_ID:
#   cd dashboard
#   npm i -g vercel
#   vercel link   (vincular el proyecto; genera .vercel/project.json)
#   cat .vercel/project.json
#
# Entornos:
#   push a main → producción (vercel --prod)
#   PR preview  → preview URL automática (sin --prod)
name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

concurrency:
  group: deploy-dashboard-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.x'

jobs:
  deploy:
    name: Build & Deploy Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # No hay package-lock.json comprometido en el repo (ni raíz ni por
      # paquete), así que `cache: npm` no resuelve ninguna ruta y `npm ci`
      # no puede correr. Mismo criterio que ya usan ci.yml y deploy-backend.yml.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build (typecheck + vite build)
        run: npm run build
        env:
          # Inyectar variables de entorno de producción si las hay
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: dashboard
          # --prod solo cuando viene de push a main o se selecciona producción
          vercel-args: >-
            ${{
              (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
              github.event.inputs.environment == 'production'
              && '--prod' || ''
            }}

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Dashboard preview desplegado. Ver URL en el log de Vercel.'
            })
