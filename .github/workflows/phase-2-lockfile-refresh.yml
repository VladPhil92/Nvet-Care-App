name: Phase 2 Lockfile Refresh

on:
  push:
    branches:
      - security/phase-2-nest12-runtime-closure
    paths:
      - package.json
      - backend/package.json
      - .github/workflows/phase-2-lockfile-refresh.yml

permissions:
  contents: write

concurrency:
  group: phase-2-lockfile-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v7
        with:
          ref: security/phase-2-nest12-runtime-closure
          fetch-depth: 0

      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Regenerate canonical lockfile
        run: npm install --package-lock-only --include=dev --legacy-peer-deps --no-fund

      - name: Verify Nest 12 dependency family
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const expected = {
            '@nestjs/common': /^12\./,
            '@nestjs/core': /^12\./,
            '@nestjs/platform-express': /^12\./,
            '@nestjs/platform-socket.io': /^12\./,
            '@nestjs/websockets': /^12\./,
            '@nestjs/swagger': /^12\./,
            'nestjs-pino': /^5\./,
            'pino': /^10\./,
          };
          for (const [name, pattern] of Object.entries(expected)) {
            const key = name.startsWith('@')
              ? `node_modules/${name}`
              : `node_modules/${name}`;
            const version = lock.packages?.[key]?.version;
            if (!version || !pattern.test(version)) {
              throw new Error(`${name} resolved to unexpected version: ${version ?? 'missing'}`);
            }
            console.log(name, version);
          }
          NODE

      - name: Capture production audit evidence
        shell: bash
        run: |
          mkdir -p .artifacts
          npm audit --omit=dev --json > .artifacts/phase-2-npm-audit.json || true

      - name: Upload audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: phase-2-nest12-audit
          path: .artifacts/phase-2-npm-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): regenerate lockfile for Nest 12"
          git push origin HEAD:security/phase-2-nest12-runtime-closure
