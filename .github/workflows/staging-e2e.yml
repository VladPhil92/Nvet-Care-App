# Autonomous certification gate for the isolated Nvet staging environment.
#
# The workflow never mutates production and does not retain E2E passwords in
# GitHub. It rotates synthetic credentials in Railway staging, deploys the exact
# candidate SHA, lets the staging predeploy seed those identities, then verifies
# readiness/auth/discovery through the public staging API.
name: Staging E2E Seed & Preflight

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvet-staging-e2e-certification
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'
  RAILWAY_PROJECT_ID: 61c97ce7-fd4d-4d8d-9e28-8c0ef964d8cd
  RAILWAY_STAGING_ENVIRONMENT_ID: 9267d965-e5e4-4c6f-af93-001c73cf62b4
  RAILWAY_STAGING_SERVICE_ID: dc5c2eee-3f8d-4416-8854-a921ea694735
  RAILWAY_PRODUCTION_SERVICE_ID: 42e734a0-931b-45c8-a091-4334b54e9d1c

jobs:
  seed-and-preflight:
    name: Deploy, rotate fixtures and verify isolated staging
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RC_CANDIDATE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout certified candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RC_CANDIDATE_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prepare autonomous staging certification session
        run: node scripts/railway-staging-session.mjs prepare

      - name: Verify staging readiness, identities and emergency discovery
        run: node mobile/e2e/preflight.mjs

      - name: Staging gate summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Nvet isolated staging certification'
            echo ''
            echo "- Candidate: \`${RC_CANDIDATE_SHA}\`"
            echo '- Target guard: Nvet Care App / staging / nvet-staging-backend.'
            echo '- Credentials: runtime-generated synthetic CLIENT/VET/ADMIN passwords, stored only as Railway staging variables and masked in Actions.'
            echo '- Deployment: exact candidate SHA through Railway API.'
            echo '- Seed: staging predeploy only; production service ID is explicitly refused.'
            echo '- Checks: /api/health/ready revision + CLIENT/VET authentication + Emergencias/Disponible ahora discovery.'
            echo ''
            echo '> A green run is staging application evidence. It is not provider backup evidence and does not prove real funds movement.'
          } >> "$GITHUB_STEP_SUMMARY"
