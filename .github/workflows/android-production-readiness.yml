name: Android Production Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - 'mobile/App.tsx'
      - 'mobile/package.json'
      - 'mobile/src/services/auth.service.ts'
      - 'mobile/src/services/pet.service.ts'
      - 'mobile/src/services/appointment.service.ts'
      - 'mobile/src/services/live-location.service.ts'
      - 'mobile/src/services/chat.service.ts'
      - 'mobile/src/services/payment.service.ts'
      - 'mobile/src/services/ai.service.ts'
      - 'mobile/src/services/notification.service.ts'
      - 'backend/src/profile/profile.controller.ts'
      - '.github/workflows/release-android.yml'
      - '.github/workflows/android-production-readiness.yml'
      - 'docs/production/ANDROID_PRODUCTION_READINESS.json'
      - 'docs/production/ANDROID_PLAY_COMPLIANCE.json'
      - 'docs/production/GOOGLE_PLAY_DATA_SAFETY.md'
      - 'docs/production/NVET_PRIVACY_POLICY_SOURCE.md'
      - 'docs/production/ANDROID_PLAY_REVIEWER_ACCESS.md'
      - 'docs/production/ANDROID_16_BEHAVIOR_REVIEW.md'
      - 'docs/PHASE_13_ANDROID_PRODUCTION.md'
      - 'scripts/verify-android-production-readiness.mjs'
      - 'scripts/audit-android-play-compliance.mjs'
      - 'scripts/verify-android16-compatibility.mjs'
      - '.github/workflows/ci.yml'
      - '.gitignore'
  schedule:
    - cron: '41 12 * * *'
  workflow_dispatch:
    inputs:
      enforce:
        description: 'Fail if any Android production rollout gate is blocked'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: android-production-readiness-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate Android production contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Validate Phase 13 contract
        run: node scripts/verify-android-production-readiness.mjs --contract-only
      - name: Audit Google Play compliance contract
        run: node scripts/audit-android-play-compliance.mjs --write-evidence
      - name: Validate Android 16 compatibility contract
        run: node scripts/verify-android16-compatibility.mjs

  audit:
    name: Audit live Android production evidence
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ANDROID_ENFORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.enforce && 'true' || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Audit Google Play compliance contract
        run: node scripts/audit-android-play-compliance.mjs --write-evidence
      - name: Validate Android 16 compatibility contract
        run: node scripts/verify-android16-compatibility.mjs
      - name: Audit current main Android evidence
        run: node scripts/verify-android-production-readiness.mjs --runtime
