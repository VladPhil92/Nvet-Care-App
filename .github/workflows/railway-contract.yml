name: Railway Contract

on:
  push:
    branches: ['**']
    paths:
      - 'backend/**'
      - 'nvet-backend/**'
      - 'Dockerfile.railway'
      - 'railway.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/railway-contract.yml'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'nvet-backend/**'
      - 'Dockerfile.railway'
      - 'railway.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/railway-contract.yml'
      - '.github/workflows/deploy-backend.yml'

jobs:
  contract:
    name: Railway deployment contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Validate workspace and active Railway mode
        run: |
          node --check backend/scripts/production-predeploy.mjs
          node --check backend/scripts/railway-runtime-smoke.mjs
          node - <<'NODE'
          const fs = require('fs');
          const root = require('./package.json');
          const backend = require('./backend/package.json');
          const railway = require('./railway.json');
          const prismaSchema = fs.readFileSync('backend/prisma/schema.prisma', 'utf8');
          const liveLocationSql = fs.readFileSync('backend/prisma/migrations/manual/live_location_v1.sql', 'utf8');

          if (!Array.isArray(root.workspaces) || !root.workspaces.includes('backend')) {
            throw new Error('backend must remain part of the root npm workspace');
          }
          if (backend.scripts?.['railway:start'] !== 'node scripts/railway-runtime-smoke.mjs') {
            throw new Error('railway:start must execute the canonical runtime smoke gate');
          }
          if (backend.scripts?.['deploy:preflight'] !== 'node scripts/production-predeploy.mjs') {
            throw new Error('deploy:preflight must remain fail-closed');
          }
          if (railway.build?.builder !== 'DOCKERFILE') {
            throw new Error('Railway must use the Dockerfile builder');
          }

          // Prisma String @default(uuid()) maps to PostgreSQL TEXT unless @db.Uuid
          // is explicitly declared. Keep the manual live-location FK aligned.
          if (!/model\s+Appointment\s*\{[\s\S]*?\bid\s+String\s+@id\s+@default\(uuid\(\)\)/m.test(prismaSchema)) {
            throw new Error('Appointment.id contract changed; review live_location_v1.sql FK type');
          }
          if (!/appointment_id\s+TEXT\s+PRIMARY\s+KEY/i.test(liveLocationSql)) {
            throw new Error('appointment_live_locations.appointment_id must remain TEXT');
          }
          if (/appointment_id\s+UUID\s+PRIMARY\s+KEY/i.test(liveLocationSql)) {
            throw new Error('UUID appointment_id would be incompatible with appointments.id TEXT');
          }

          const dockerfile = railway.build?.dockerfilePath;
          if (dockerfile === '/nvet-backend/Dockerfile') {
            if (railway.deploy?.startCommand !== 'node runtime-smoke.mjs') {
              throw new Error('Bridge mode must start runtime-smoke.mjs');
            }
            if (!railway.deploy?.preDeployCommand?.includes('npm run deploy:preflight')) {
              throw new Error('Bridge mode must run fail-closed predeploy');
            }
            console.log('Railway active mode: verified compatibility bridge');
          } else if (dockerfile === '/Dockerfile.railway') {
            if (railway.deploy?.startCommand !== 'node backend/scripts/railway-runtime-smoke.mjs') {
              throw new Error('Canonical mode must start backend runtime smoke gate');
            }
            if (!railway.deploy?.preDeployCommand?.includes('npm run deploy:preflight --workspace backend')) {
              throw new Error('Canonical mode must reconcile backend workspace');
            }
            console.log('Railway active mode: canonical backend image');
          } else {
            throw new Error(`Unsupported Railway dockerfilePath: ${dockerfile}`);
          }

          for (const p of [
            'Dockerfile.railway',
            'nvet-backend/Dockerfile',
            'nvet-backend/bridge.mjs',
            'nvet-backend/runtime-smoke.mjs',
          ]) {
            if (!fs.existsSync(p)) throw new Error(`Required transition artifact missing: ${p}`);
          }
          NODE

      - name: Build canonical candidate from repository root
        run: docker build --file Dockerfile.railway --tag nvet-railway-canonical:ci .

      - name: Verify canonical candidate contract
        run: |
          docker inspect nvet-railway-canonical:ci --format '{{json .Config.Cmd}}' | grep -q 'railway-runtime-smoke.mjs'
          docker run --rm --entrypoint node nvet-railway-canonical:ci \
            -e "const fs=require('fs'); for (const p of ['/app/backend/dist/main.js','/app/backend/scripts/production-predeploy.mjs','/app/backend/scripts/railway-runtime-smoke.mjs']) if(!fs.existsSync(p)) process.exit(1);"

      - name: Build active rollback bridge from repository root
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker build \
            --file nvet-backend/Dockerfile \
            --build-arg RAILWAY_GIT_COMMIT_SHA="$SOURCE_SHA" \
            --tag nvet-railway-bridge:ci \
            .
