name: Web Production Convergence

on:
  workflow_run:
    workflows: ['Nvet Transfer Payment Rail Certification']
    types: [completed]
  schedule:
    - cron: '12 */6 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: nvet-web-production-convergence
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'
  RAILWAY_PROJECT_ID: 61c97ce7-fd4d-4d8d-9e28-8c0ef964d8cd
  RAILWAY_STAGING_ENVIRONMENT_ID: 9267d965-e5e4-4c6f-af93-001c73cf62b4
  RAILWAY_STAGING_SERVICE_ID: dc5c2eee-3f8d-4416-8854-a921ea694735
  RAILWAY_PRODUCTION_SERVICE_ID: 42e734a0-931b-45c8-a091-4334b54e9d1c

jobs:
  converge:
    name: Certify web + backend technical convergence
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    env:
      RC_CANDIDATE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

    steps:
      - name: Checkout certified candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RC_CANDIDATE_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify production backend readiness now
        id: production
        shell: bash
        run: |
          set -euo pipefail
          url='https://backend-production-a476.up.railway.app/api/health/ready'
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          code="$(curl --silent --show-error --location --max-time 15 --output "$tmp" --write-out '%{http_code}' "$url")"
          test "$code" = '200'
          node - "$tmp" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body?.status !== 'ok' || body?.checks?.database?.status !== 'up' || typeof body?.revision !== 'string') {
            process.exit(1);
          }
          console.log(`Production backend ready at revision ${body.revision}`);
          NODE

      - name: Verify ctgone.com federated Nvet connectivity now
        id: ctg
        shell: bash
        run: |
          set -euo pipefail
          url='https://ctgone.com/api/nvetcareapp/health'
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          code="$(curl --silent --show-error --location --max-time 15 --output "$tmp" --write-out '%{http_code}' "$url")"
          test "$code" = '200'
          node - "$tmp" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body?.status !== 'ok' || body?.dependency !== 'nvet-backend') process.exit(1);
          console.log('ctgone.com -> Nvet backend connectivity is healthy.');
          NODE

      - name: Load autonomous staging evidence session
        id: staging_inputs
        run: node scripts/railway-staging-session.mjs load

      - name: Verify isolated staging candidate, identity and discovery
        id: staging
        shell: bash
        run: |
          set -euo pipefail
          node mobile/e2e/preflight.mjs

          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          code="$(curl --silent --show-error --location --max-time 15 --output "$tmp" --write-out '%{http_code}' "${E2E_API_URL%/}/health/ready")"
          test "$code" = '200'
          node - "$tmp" "$RC_CANDIDATE_SHA" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const expected = process.argv[3].slice(0, 12).toLowerCase();
          const revision = String(body?.revision || '').toLowerCase();
          if (!revision.startsWith(expected)) {
            console.error(`Staging candidate mismatch: expected ${expected}, received ${body?.revision ?? 'missing'}`);
            process.exit(1);
          }
          console.log(`Staging candidate revision verified: ${body.revision}`);
          NODE

          echo 'RC_STAGING_PREFLIGHT_CURRENT=true' >> "$GITHUB_ENV"

      - name: Enforce machine-verifiable RC gates
        id: machine
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RC_ENFORCE: 'true'
        run: node scripts/verify-release-candidate-readiness.mjs --runtime --machine-only

      - name: Publish full RC report without masking operator blockers
        id: report
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RC_ENFORCE: 'false'
        run: node scripts/verify-release-candidate-readiness.mjs --runtime

      - name: Convergence summary
        if: always()
        shell: bash
        run: |
          outcome_label() {
            case "$1" in
              success) printf 'PASS' ;;
              failure) printf 'BLOCKED' ;;
              skipped) printf 'SKIPPED' ;;
              *) printf '%s' "$1" ;;
            esac
          }

          {
            echo '## Web Production Convergence'
            echo "- Candidate: $RC_CANDIDATE_SHA"
            echo "- Production backend readiness: $(outcome_label '${{ steps.production.outcome }}')"
            echo "- ctgone.com → Nvet backend connectivity: $(outcome_label '${{ steps.ctg.outcome }}')"
            echo "- Railway staging session: $(outcome_label '${{ steps.staging_inputs.outcome }}')"
            echo "- Isolated staging candidate/identity/discovery: $(outcome_label '${{ steps.staging.outcome }}')"
            echo "- Machine-verifiable RC gates: $(outcome_label '${{ steps.machine.outcome }}')"
            echo "- Full RC evidence report: $(outcome_label '${{ steps.report.outcome }}')"
            echo ''
            echo '> Automatic chain: CI → isolated staging → TRANSFER application certification → convergence. External provider backup/restore and real-funds evidence remain separate promotion gates.'
          } >> "$GITHUB_STEP_SUMMARY"
