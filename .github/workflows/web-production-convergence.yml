name: Web Production Convergence

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  schedule:
    - cron: '12 */6 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: nvet-web-production-convergence
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'

jobs:
  converge:
    name: Certify web + backend technical convergence
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    env:
      RC_CANDIDATE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      E2E_API_URL: ${{ secrets.E2E_API_URL }}
      E2E_CLIENT_EMAIL: ${{ secrets.E2E_CLIENT_EMAIL }}
      E2E_CLIENT_PASSWORD: ${{ secrets.E2E_CLIENT_PASSWORD }}
      E2E_VET_EMAIL: ${{ secrets.E2E_VET_EMAIL }}
      E2E_VET_PASSWORD: ${{ secrets.E2E_VET_PASSWORD }}

    steps:
      - name: Checkout certified candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RC_CANDIDATE_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify production backend readiness now
        id: production
        shell: bash
        run: |
          set -euo pipefail
          url='https://backend-production-a476.up.railway.app/api/health/ready'
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          code="$(curl --silent --show-error --location --max-time 15 --output "$tmp" --write-out '%{http_code}' "$url")"
          test "$code" = '200'
          node - "$tmp" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body?.status !== 'ok' || body?.checks?.database?.status !== 'up' || typeof body?.revision !== 'string') {
            process.exit(1);
          }
          console.log(`Production backend ready at revision ${body.revision}`);
          NODE

      - name: Verify ctgone.com federated Nvet connectivity now
        id: ctg
        shell: bash
        run: |
          set -euo pipefail
          url='https://ctgone.com/api/nvetcareapp/health'
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          code="$(curl --silent --show-error --location --max-time 15 --output "$tmp" --write-out '%{http_code}' "$url")"
          test "$code" = '200'
          node - "$tmp" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body?.status !== 'ok' || body?.dependency !== 'nvet-backend') process.exit(1);
          console.log('ctgone.com -> Nvet backend connectivity is healthy.');
          NODE

      - name: Validate staging evidence inputs
        id: staging_inputs
        shell: bash
        run: |
          set -euo pipefail
          missing=''
          [ -z "$E2E_API_URL" ] && missing="$missing E2E_API_URL"
          [ -z "$E2E_CLIENT_EMAIL" ] && missing="$missing E2E_CLIENT_EMAIL"
          [ -z "$E2E_CLIENT_PASSWORD" ] && missing="$missing E2E_CLIENT_PASSWORD"
          [ -z "$E2E_VET_EMAIL" ] && missing="$missing E2E_VET_EMAIL"
          [ -z "$E2E_VET_PASSWORD" ] && missing="$missing E2E_VET_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing staging environment secrets:$missing"
            exit 1
          fi

          if ! printf '%s' "$E2E_API_URL" | grep -Eq '^https://[^[:space:]]+/api/?$'; then
            echo '::error::E2E_API_URL must be an absolute HTTPS URL ending in /api.'
            exit 1
          fi

      - name: Verify isolated staging identity and discovery
        id: staging
        shell: bash
        run: |
          set -euo pipefail
          node mobile/e2e/preflight.mjs
          echo 'RC_STAGING_PREFLIGHT_CURRENT=true' >> "$GITHUB_ENV"

      - name: Enforce machine-verifiable RC gates
        id: machine
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RC_ENFORCE: 'true'
        run: node scripts/verify-release-candidate-readiness.mjs --runtime --machine-only

      - name: Publish full RC report without masking operator blockers
        id: report
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RC_ENFORCE: 'false'
        run: node scripts/verify-release-candidate-readiness.mjs --runtime

      - name: Convergence summary
        if: always()
        shell: bash
        run: |
          outcome_label() {
            case "$1" in
              success) printf 'PASS' ;;
              failure) printf 'BLOCKED' ;;
              skipped) printf 'SKIPPED' ;;
              *) printf '%s' "$1" ;;
            esac
          }

          {
            echo '## Web Production Convergence'
            echo "- Candidate: $RC_CANDIDATE_SHA"
            echo "- Production backend readiness: $(outcome_label '${{ steps.production.outcome }}')"
            echo "- ctgone.com → Nvet backend connectivity: $(outcome_label '${{ steps.ctg.outcome }}')"
            echo "- Staging evidence inputs: $(outcome_label '${{ steps.staging_inputs.outcome }}')"
            echo "- Isolated staging identity/discovery: $(outcome_label '${{ steps.staging.outcome }}')"
            echo "- Machine-verifiable RC gates: $(outcome_label '${{ steps.machine.outcome }}')"
            echo "- Full RC evidence report: $(outcome_label '${{ steps.report.outcome }}')"
            echo ''
            echo '> Staging remains fail-closed. A staging configuration failure must not hide independent production or CTG One health evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
