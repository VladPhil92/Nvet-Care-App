name: Provision Isolated Staging

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Railway project ID that currently hosts Nvet Care production'
        required: true
        type: string
      frontend_url:
        description: 'Allowed frontend origin for staging links/CORS'
        required: true
        default: 'https://ctgone.com'
        type: string
      confirm:
        description: 'Type provision-staging exactly'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nvet-isolated-staging-bootstrap
  cancel-in-progress: false

env:
  NODE_VERSION: '22.x'
  STAGING_ENVIRONMENT: staging
  BACKEND_SERVICE: nvet-staging-backend
  POSTGRES_SERVICE: nvet-staging-postgres
  E2E_CLIENT_EMAIL: cliente@nvetcare.test
  E2E_CLIENT_PASSWORD: TestClient123!
  E2E_VET_EMAIL: vet@nvetcare.test
  E2E_VET_PASSWORD: TestVet123!

jobs:
  provision:
    name: Provision Railway staging and certify preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PROJECT_ID: ${{ inputs.project_id }}
      FRONTEND_URL: ${{ inputs.frontend_url }}

    steps:
      - name: Require explicit authorization
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "provision-staging" ]; then
            echo '::error::Confirmation refused. Type provision-staging exactly.'
            exit 1
          fi
          if [ -z "$RAILWAY_API_TOKEN" ]; then
            echo '::error::Missing repository secret RAILWAY_API_TOKEN.'
            exit 1
          fi
          if [ -z "$PROJECT_ID" ]; then
            echo '::error::Railway project_id is required.'
            exit 1
          fi
          if ! printf '%s' "$FRONTEND_URL" | grep -Eq '^https://[^[:space:]]+$'; then
            echo '::error::frontend_url must be an absolute HTTPS URL.'
            exit 1
          fi

      - name: Checkout canonical mainline source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate staging bootstrap contract
        run: |
          node --check scripts/railway-staging-bootstrap.mjs
          node --check backend/scripts/production-predeploy.mjs
          node --check backend/scripts/railway-runtime-smoke.mjs

      - name: Provision isolated Railway environment via Public API
        run: node scripts/railway-staging-bootstrap.mjs

      - name: Certify staging API fixtures and emergency discovery
        run: node mobile/e2e/preflight.mjs

      - name: Publish non-secret staging handoff
        run: |
          {
            echo '## Nvet Care isolated staging provisioned'
            echo ''
            echo "- Environment: \`$STAGING_ENVIRONMENT\`"
            echo "- Environment ID: \`$STAGING_ENVIRONMENT_ID\`"
            echo "- Backend service: \`$BACKEND_SERVICE\`"
            echo "- Backend service ID: \`$STAGING_BACKEND_SERVICE_ID\`"
            echo "- PostgreSQL service: \`$POSTGRES_SERVICE\`"
            echo "- API: \`$STAGING_API_URL\`"
            echo '- PostgreSQL: isolated private-network service with persistent volume; no public database endpoint was created.'
            echo '- Schema preflight: applied inside Railway predeploy.'
            echo '- Deterministic E2E seed: applied inside isolated staging predeploy.'
            echo '- CTG One identity exchange: deliberately disabled in synthetic staging.'
            echo '- API readiness + client/vet auth + emergency search preflight: passed.'
            echo ''
            echo 'Next gate: Android Detox against this staging API, then RC1 release-readiness.'
          } >> "$GITHUB_STEP_SUMMARY"
