name: Provision Nvet Production Backup Bucket

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provision-production-backup-bucket.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvet-production-backup-bucket-bootstrap
  cancel-in-progress: false

env:
  RAILWAY_PROJECT_ID: 61c97ce7-fd4d-4d8d-9e28-8c0ef964d8cd
  RAILWAY_WORKSPACE_ID: 50f238be-0cc2-470c-8c7b-42e55656b503
  RAILWAY_PRODUCTION_ENVIRONMENT_ID: 7f93c67e-5a63-4aae-80b6-90979a9b60b1
  RAILWAY_BACKUP_BUCKET_NAME: nvet-production-backups
  RAILWAY_BACKUP_BUCKET_REGION: ams
  RAILWAY_BACKUP_SERVICE_ID: 62256607-5029-4ae4-88a0-fd378ecdf27b

jobs:
  provision-production-backup-bucket:
    name: Provision production object storage and trigger backup worker
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Railway CLI
        run: npm install --global @railway/cli@latest

      - name: Validate Railway credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_API_TOKEN:-}" ]; then
            echo '::error::RAILWAY_API_TOKEN is required to provision the production backup bucket.'
            exit 1
          fi

      - name: Link production project and environment
        shell: bash
        run: |
          set -euo pipefail
          railway link \
            --workspace "$RAILWAY_WORKSPACE_ID" \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_PRODUCTION_ENVIRONMENT_ID"

      - name: Ensure production backup bucket exists
        id: bucket
        shell: bash
        run: |
          set -euo pipefail
          railway bucket -e "$RAILWAY_PRODUCTION_ENVIRONMENT_ID" list --json > /tmp/railway-buckets.json

          if node - <<'NODE'
          const fs = require('fs');
          const buckets = JSON.parse(fs.readFileSync('/tmp/railway-buckets.json', 'utf8'));
          const name = process.env.RAILWAY_BACKUP_BUCKET_NAME;
          process.exit(Array.isArray(buckets) && buckets.some((bucket) => bucket?.name === name) ? 0 : 1);
          NODE
          then
            echo "Bucket $RAILWAY_BACKUP_BUCKET_NAME already exists; preserving it."
            echo 'created=false' >> "$GITHUB_OUTPUT"
          else
            railway bucket -e "$RAILWAY_PRODUCTION_ENVIRONMENT_ID" create \
              "$RAILWAY_BACKUP_BUCKET_NAME" \
              --region "$RAILWAY_BACKUP_BUCKET_REGION" \
              --json > /tmp/railway-bucket-create.json

            node - <<'NODE'
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('/tmp/railway-bucket-create.json', 'utf8'));
            if (result?.staged === true && result?.committed !== true) {
              console.error('Bucket creation was staged instead of committed. Commit Railway staged changes before backup certification.');
              process.exit(2);
            }
            if (!result?.id || !result?.name) {
              console.error('Railway did not return a valid bucket creation result.');
              process.exit(3);
            }
            console.log(`Created Railway bucket ${result.name} in ${result.region ?? 'requested region'}.`);
            NODE
            echo 'created=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify bucket metadata
        shell: bash
        run: |
          set -euo pipefail
          railway bucket \
            -e "$RAILWAY_PRODUCTION_ENVIRONMENT_ID" \
            -b "$RAILWAY_BACKUP_BUCKET_NAME" \
            info --json > /tmp/railway-bucket-info.json

          node - <<'NODE'
          const fs = require('fs');
          const info = JSON.parse(fs.readFileSync('/tmp/railway-bucket-info.json', 'utf8'));
          const expectedName = process.env.RAILWAY_BACKUP_BUCKET_NAME;
          const expectedRegion = process.env.RAILWAY_BACKUP_BUCKET_REGION;
          if (info?.name !== expectedName) throw new Error(`Unexpected bucket name: ${info?.name}`);
          if (info?.region !== expectedRegion) throw new Error(`Unexpected bucket region: ${info?.region}`);
          console.log(`Bucket certified: ${info.name} (${info.region}); objects=${info.objects ?? 0}.`);
          NODE

      - name: Trigger canonical backup worker
        shell: bash
        run: |
          set -euo pipefail
          railway redeploy \
            -s "$RAILWAY_BACKUP_SERVICE_ID" \
            -e "$RAILWAY_PRODUCTION_ENVIRONMENT_ID" \
            --yes

      - name: Publish provisioning summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Production backup bucket bootstrap'
            echo ''
            echo "- Bucket: \`$RAILWAY_BACKUP_BUCKET_NAME\`"
            echo "- Region: \`$RAILWAY_BACKUP_BUCKET_REGION\`"
            echo "- Created in this run: \`${{ steps.bucket.outputs.created || 'unknown' }}\`"
            echo "- Backup worker: \`$RAILWAY_BACKUP_SERVICE_ID\`"
            echo ''
            echo '> This workflow never prints or exports S3 access credentials. The worker consumes Railway bucket credentials through service references.'
          } >> "$GITHUB_STEP_SUMMARY"
