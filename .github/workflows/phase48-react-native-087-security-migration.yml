name: Nvet Phase 48 React Native 0.87 Security Migration

on:
  push:
    branches:
      - fix/react-native-087-security-migration-20260923
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'mobile/package.json'
      - 'mobile/android/**'
      - 'mobile/babel.config.js'
      - '.github/workflows/phase48-react-native-087-security-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase48-react-native-087-security-migration
  cancel-in-progress: true

jobs:
  lockfile-and-audit:
    name: Regenerate lockfile and audit RN 0.87
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/react-native-087-security-migration-20260923
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3

      - name: Regenerate canonical lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Capture production dependency audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/phase48
          set +e
          npm audit --omit=dev --json > .artifacts/phase48/npm-audit-production.json
          audit_exit=$?
          set -e
          node -e "const a=require('./.artifacts/phase48/npm-audit-production.json'); const v=a.metadata?.vulnerabilities||{}; console.log(JSON.stringify(v)); if ((v.critical||0)>0 || (v.high||0)>0) process.exit(2)"
          echo "npm audit raw exit code: ${audit_exit}"

      - name: Commit deterministic lockfile refresh
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'Canonical lockfile already converged.'
            exit 0
          fi
          git config user.name 'nvet-release-bot'
          git config user.email '125180580+VladPhil92@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(mobile): regenerate RN 0.87 lockfile'
          git push origin HEAD:fix/react-native-087-security-migration-20260923
