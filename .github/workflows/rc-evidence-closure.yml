name: Nvet RC Evidence Closure Phase VI

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/production/RC_EVIDENCE_CLOSURE_CONTROL.json'
      - 'docs/production/RC_READINESS.json'
      - 'docs/production/GLOBAL_READINESS.json'
      - 'docs/production/OPERATOR_EVIDENCE_CONTROL.json'
      - 'scripts/rc-evidence-closure-control.mjs'
      - 'scripts/audit-railway-production-backups.mjs'
      - 'scripts/lib/railway-graphql-client.mjs'
      - '.github/workflows/rc-evidence-closure.yml'
  push:
    branches: [main]
    paths:
      - 'docs/production/RC_EVIDENCE_CLOSURE_CONTROL.json'
      - 'docs/production/RC_READINESS.json'
      - 'docs/production/GLOBAL_READINESS.json'
      - 'docs/production/OPERATOR_EVIDENCE_CONTROL.json'
      - 'scripts/rc-evidence-closure-control.mjs'
      - 'scripts/audit-railway-production-backups.mjs'
      - 'scripts/lib/railway-graphql-client.mjs'
      - '.github/workflows/rc-evidence-closure.yml'
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Report current RC evidence state or fail closed until promotion is legitimately eligible
        required: true
        default: report
        type: choice
        options:
          - report
          - enforce-ready

permissions:
  contents: read

concurrency:
  group: nvet-rc-evidence-closure-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'
  RAILWAY_PROJECT_ID: 61c97ce7-fd4d-4d8d-9e28-8c0ef964d8cd
  RAILWAY_PRODUCTION_ENVIRONMENT_ID: 7f93c67e-5a63-4aae-80b6-90979a9b60b1
  RAILWAY_EXPECTED_PROJECT_NAME: Nvet Care App
  RAILWAY_PRODUCTION_POSTGRES_SERVICE: Postgres
  RAILWAY_MAX_BACKUP_AGE_HOURS: '48'
  RAILWAY_MIN_BACKUP_RETENTION_HOURS: '168'

jobs:
  contract:
    name: Validate RC evidence closure contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate Phase VI dependency and authority contract
        run: node scripts/rc-evidence-closure-control.mjs --contract-only

  live-report:
    name: Observe live RC blockers and build operator handoff
    needs: contract
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Observe GitHub main protection without mutating it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          gh api "repos/${GITHUB_REPOSITORY}/branches/main" > .artifacts/github-main-branch.json

          detail_observed=false
          if gh api "repos/${GITHUB_REPOSITORY}/branches/main/protection/required_status_checks" \
            > .artifacts/github-required-status-checks.json 2>/dev/null; then
            detail_observed=true
          else
            printf '{}\n' > .artifacts/github-required-status-checks.json
          fi

          DETAIL_OBSERVED="$detail_observed" node <<'NODE'
          const fs = require('fs');
          const branch = JSON.parse(fs.readFileSync('.artifacts/github-main-branch.json', 'utf8'));
          const required = JSON.parse(fs.readFileSync('.artifacts/github-required-status-checks.json', 'utf8'));
          const contexts = new Set([
            ...(Array.isArray(required.contexts) ? required.contexts : []),
            ...(Array.isArray(required.checks) ? required.checks.map((check) => check.context).filter(Boolean) : []),
          ]);
          const observation = {
            schemaVersion: 1,
            observedAt: new Date().toISOString(),
            branch: branch.name,
            protected: branch.protected === true,
            requiredCheckDetailObserved: process.env.DETAIL_OBSERVED === 'true',
            requiredCiSuccessObserved: contexts.has('CI Success'),
            boundary: 'Read-only GitHub observation. A green observation does not update GLOBAL_READINESS.json; approval through Operator Evidence Control remains required.',
          };
          fs.writeFileSync('.artifacts/main-branch-protection-observation.json', `${JSON.stringify(observation, null, 2)}\n`);
          NODE

      - name: Observe Railway production backup state without mutating it
        continue-on-error: true
        run: node scripts/audit-railway-production-backups.mjs

      - name: Build Phase VI closure artifact
        shell: bash
        env:
          RC_CLOSURE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'report' }}"
          if [ "$MODE" = 'enforce-ready' ]; then
            node scripts/rc-evidence-closure-control.mjs --enforce-ready
          else
            node scripts/rc-evidence-closure-control.mjs
          fi

      - name: Upload redacted RC closure observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nvet-rc-evidence-closure-phase-vi
          path: |
            .artifacts/rc-evidence-closure.json
            .artifacts/production-backup-evidence.json
            .artifacts/main-branch-protection-observation.json
          if-no-files-found: warn
          retention-days: 30
