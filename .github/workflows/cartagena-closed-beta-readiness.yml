name: Cartagena Closed Beta Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/beta/**'
      - 'backend/src/appointments/appointments.service.ts'
      - 'backend/src/appointments/appointments.module.ts'
      - 'backend/.env.example'
      - 'dashboard/src/App.tsx'
      - 'dashboard/src/components/Sidebar.tsx'
      - 'dashboard/src/pages/BetaEvidencePage.tsx'
      - 'dashboard/src/pages/BetaCohortPage.tsx'
      - 'docs/production/BETA_CARTAGENA_READINESS.json'
      - 'docs/production/RC_READINESS.json'
      - 'docs/production/CARTAGENA_BETA_OPERATIONS_RUNBOOK.md'
      - 'docs/PHASE_12_CARTAGENA_CLOSED_BETA.md'
      - 'docs/PHASE_12C_BETA_OPERATIONAL_ACTIVATION_READINESS.md'
      - 'docs/PHASE_12D_BETA_EVIDENCE_CONTROL_PLANE.md'
      - 'docs/PHASE_12E_CONTROLLED_BETA_ACTIVATION_AUTHORIZATION.md'
      - 'docs/PHASE_12F_BETA_COHORT_CONTROL_PLANE.md'
      - 'scripts/verify-cartagena-beta-readiness.mjs'
      - 'scripts/verify-cartagena-beta-evidence-inheritance.mjs'
      - 'scripts/verify-beta-operational-activation-readiness.mjs'
      - 'scripts/verify-beta-evidence-control-plane.mjs'
      - '.github/workflows/cartagena-closed-beta-readiness.yml'
  schedule:
    - cron: '29 12 * * *'
  workflow_dispatch:
    inputs:
      enforce:
        description: 'Fail if any Cartagena closed-beta activation gate is blocked'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: cartagena-closed-beta-readiness-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate Cartagena beta contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Validate Phase 12 contract
        run: node scripts/verify-cartagena-beta-readiness.mjs --contract-only
      - name: Verify inherited RC evidence cannot drift
        run: node scripts/verify-cartagena-beta-evidence-inheritance.mjs
      - name: Verify operational activation-state contract
        run: node scripts/verify-beta-operational-activation-readiness.mjs
      - name: Verify evidence, cohort and activation control plane contract
        run: node scripts/verify-beta-evidence-control-plane.mjs

  audit:
    name: Audit live Cartagena beta evidence
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      BETA_ENFORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.enforce && 'true' || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Verify inherited RC evidence cannot drift
        run: node scripts/verify-cartagena-beta-evidence-inheritance.mjs
      - name: Verify operational activation-state contract
        run: node scripts/verify-beta-operational-activation-readiness.mjs
      - name: Verify evidence, cohort and activation control plane contract
        run: node scripts/verify-beta-evidence-control-plane.mjs
      - name: Audit current main beta evidence
        run: node scripts/verify-cartagena-beta-readiness.mjs --runtime
