# CI workflow for Nvet Care Platform monorepo.
#
# Jobs en paralelo para backend, mobile, Android native y dashboard.
# El repositorio usa npm workspaces y un package-lock.json canónico en la raíz.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev --legacy-peer-deps

      - name: Validate Prisma schema
        working-directory: backend
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub?schema=public

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub?schema=public

      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: backend
        run: npm run lint:ci

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Test (with coverage)
        working-directory: backend
        run: npm test -- --ci --coverage --maxWorkers=2
        env:
          NODE_ENV: test

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore
          retention-days: 7

  mobile:
    name: Mobile (React Native)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev --legacy-peer-deps

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Lint
        working-directory: mobile
        run: npm run lint

      - name: Test (Jest unit + MSW)
        working-directory: mobile
        run: npm run test:ci

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage
          if-no-files-found: ignore
          retention-days: 7

  android-native:
    name: Android Native (Gradle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci --include=dev --legacy-peer-deps

      - name: Verify native dependency compatibility
        working-directory: mobile
        run: |
          REANIMATED_VERSION="$(node -p "require('react-native-reanimated/package.json').version")"
          echo "Resolved react-native-reanimated: $REANIMATED_VERSION"
          test "$REANIMATED_VERSION" = "3.15.5"

      - name: Verify Gradle wrapper integrity
        working-directory: mobile
        run: |
          test "$(git hash-object android/gradle/wrapper/gradle-wrapper.jar)" = "e6441136f3d4ba8a0da8d277868979cfbc8ad796"
          ./android/gradlew --version

      - name: Build app and Detox instrumentation APKs
        working-directory: mobile/android
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ci-placeholder
        run: ./gradlew assembleDebug assembleAndroidTest -DtestBuildType=debug --no-daemon --stacktrace

      - name: Upload Android debug artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7

  dashboard:
    name: Dashboard (Vite + React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev --legacy-peer-deps

      - name: Lint
        working-directory: dashboard
        run: npm run lint

      - name: Build (includes typecheck via tsc)
        working-directory: dashboard
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist
          if-no-files-found: ignore
          retention-days: 7

  railway-legacy-bridge:
    name: Railway Legacy Root Bridge (Docker)
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build exact-SHA compatibility image with Railway root context
        run: |
          test -n "$SOURCE_SHA"
          docker build \
            --file nvet-backend/Dockerfile \
            --build-arg RAILWAY_GIT_COMMIT_SHA="$SOURCE_SHA" \
            --tag nvet-railway-compat:ci \
            .

      - name: Verify compatibility start contract
        run: |
          docker inspect nvet-railway-compat:ci --format '{{json .Config.Cmd}}' | grep -q 'start:prod'
          docker run --rm --entrypoint node nvet-railway-compat:ci \
            -e "const p=require('/compat/package.json'); if(!p.scripts?.['start:prod']?.includes('deploy:preflight')) process.exit(1);"

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [backend, mobile, android-native, dashboard, railway-legacy-bridge]
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          if [[ "${{ needs.backend.result }}" != "success" ]]; then
            echo "Backend failed: ${{ needs.backend.result }}"
            exit 1
          fi
          if [[ "${{ needs.mobile.result }}" != "success" ]]; then
            echo "Mobile failed: ${{ needs.mobile.result }}"
            exit 1
          fi
          if [[ "${{ needs.android-native.result }}" != "success" ]]; then
            echo "Android Native failed: ${{ needs.android-native.result }}"
            exit 1
          fi
          if [[ "${{ needs.dashboard.result }}" != "success" ]]; then
            echo "Dashboard failed: ${{ needs.dashboard.result }}"
            exit 1
          fi
          if [[ "${{ needs.railway-legacy-bridge.result }}" != "success" ]]; then
            echo "Railway legacy bridge failed: ${{ needs.railway-legacy-bridge.result }}"
            exit 1
          fi
          echo "All CI jobs passed."
