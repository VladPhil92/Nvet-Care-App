# CI workflow for Nvet Care Platform monorepo.
#
# Jobs en paralelo para backend, mobile, Android native y dashboard.
# El repositorio usa npm workspaces y un package-lock.json canónico en la raíz.
# Android Native es el gate más costoso; se ejecuta solo cuando el cambio
# puede afectar el artefacto Android, manteniendo fail-closed ante refs dudosas.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'

jobs:
  changes:
    name: Detect Android-impacting changes
    runs-on: ubuntu-latest
    outputs:
      android-native: ${{ steps.filter.outputs.android_native }}
    steps:
      - name: Checkout full history for diff classification
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify Android impact
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$BEFORE_SHA"
            HEAD_SHA="$GITHUB_SHA"
          fi

          # New branches / malformed event refs fail closed: run Android.
          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "Unable to establish a trustworthy diff; Android Native will run."
            echo "android_native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$CHANGED_FILES"

          if grep -Eq '^(mobile/|package\.json$|package-lock\.json$|\.github/workflows/ci\.yml$)' <<< "$CHANGED_FILES"; then
            echo "Android-impacting change detected."
            echo "android_native=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Android-impacting paths changed; expensive native packaging can be skipped safely."
            echo "android_native=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev --legacy-peer-deps

      - name: Validate Prisma schema
        working-directory: backend
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub?schema=public

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub?schema=public

      - name: Validate E2E seed contract
        working-directory: backend
        run: npm run seed:e2e:check
        env:
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub?schema=public

      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: backend
        run: npm run lint:ci

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Test (with coverage)
        working-directory: backend
        run: npm test -- --ci --coverage --maxWorkers=2
        env:
          NODE_ENV: test

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore
          retention-days: 7

  mobile:
    name: Mobile (React Native)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev --legacy-peer-deps

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Typecheck Detox E2E contract
        working-directory: mobile
        run: npx tsc --noEmit -p e2e/tsconfig.json

      - name: Lint
        working-directory: mobile
        run: npm run lint

      - name: Test (Jest unit + MSW)
        working-directory: mobile
        run: npm run test:ci

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage
          path: mobile/coverage
          if-no-files-found: ignore
          retention-days: 7

  android-native:
    name: Android Native (Gradle)
    needs: [changes]
    if: needs.changes.outputs.android-native == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci --include=dev --legacy-peer-deps

      - name: Verify native dependency compatibility
        working-directory: mobile
        run: |
          REANIMATED_VERSION="$(node -p "require('react-native-reanimated/package.json').version")"
          echo "Resolved react-native-reanimated: $REANIMATED_VERSION"
          test "$REANIMATED_VERSION" = "3.15.5"

      - name: Verify Gradle wrapper integrity
        working-directory: mobile
        run: |
          test "$(git hash-object android/gradle/wrapper/gradle-wrapper.jar)" = "e6441136f3d4ba8a0da8d277868979cfbc8ad796"
          ./android/gradlew --version

      - name: Build debug, Detox and unsigned release bundle
        working-directory: mobile/android
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ci-placeholder
          # CI compila un AAB técnico no firmado/no distribuible. El release real exige URL explícita.
          NVET_API_URL: https://ci.invalid/api
        run: ./gradlew assembleDebug assembleAndroidTest bundleRelease -DtestBuildType=debug --no-daemon --stacktrace

      - name: Verify Android release bundle
        run: test -s mobile/android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Android debug artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apks
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload unsigned release bundle
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: android-release-unsigned-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

  dashboard:
    name: Dashboard (Vite + React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev --legacy-peer-deps

      - name: Lint
        working-directory: dashboard
        run: npm run lint

      - name: Build (includes typecheck via tsc)
        working-directory: dashboard
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-dist
          path: dashboard/dist
          if-no-files-found: ignore
          retention-days: 7

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [changes, backend, mobile, android-native, dashboard]
    if: always()
    steps:
      - name: Verify all required jobs passed
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Change classifier failed: ${{ needs.changes.result }}"
            exit 1
          fi
          if [[ "${{ needs.backend.result }}" != "success" ]]; then
            echo "Backend failed: ${{ needs.backend.result }}"
            exit 1
          fi
          if [[ "${{ needs.mobile.result }}" != "success" ]]; then
            echo "Mobile failed: ${{ needs.mobile.result }}"
            exit 1
          fi
          if [[ "${{ needs.android-native.result }}" != "success" && "${{ needs.android-native.result }}" != "skipped" ]]; then
            echo "Android Native failed: ${{ needs.android-native.result }}"
            exit 1
          fi
          if [[ "${{ needs.dashboard.result }}" != "success" ]]; then
            echo "Dashboard failed: ${{ needs.dashboard.result }}"
            exit 1
          fi
          echo "CI passed. Android Native result: ${{ needs.android-native.result }}"
