# CI workflow for Nvet Care Platform monorepo.
#
# Gate productivo:
#   - backend        → install + prisma generate + lint + build + test
#   - mobile         → install + lint + typecheck + Jest/MSW
#   - android-native → Gradle assembleDebug + assembleAndroidTest
#   - dashboard      → install + lint + build/typecheck
#
# El repositorio todavía no versiona un package-lock canónico del monorepo.
# Hasta consolidarlo, CI usa npm install sin cache para evitar fallos falsos.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub?schema=public

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --ci --maxWorkers=2

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore
          retention-days: 7

  mobile:
    name: Mobile (React Native)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (Jest unit + MSW)
        run: npm run test:ci

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage
          if-no-files-found: ignore
          retention-days: 7

  android-native:
    name: Android Native (Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Gradle wrapper integrity
        run: |
          test "$(git hash-object android/gradle/wrapper/gradle-wrapper.jar)" = "e6441136f3d4ba8a0da8d277868979cfbc8ad796"
          ./android/gradlew --version

      - name: Build app and Detox instrumentation APKs
        working-directory: mobile/android
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ci-placeholder
        run: ./gradlew assembleDebug assembleAndroidTest -DtestBuildType=debug --no-daemon --stacktrace

      - name: Upload Android debug artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7

  dashboard:
    name: Dashboard (Vite + React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build (incluye typecheck via tsc)
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist
          if-no-files-found: ignore
          retention-days: 7

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [backend, mobile, android-native, dashboard]
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          if [[ "${{ needs.backend.result }}" != "success" ]]; then
            echo "Backend failed: ${{ needs.backend.result }}"
            exit 1
          fi
          if [[ "${{ needs.mobile.result }}" != "success" ]]; then
            echo "Mobile failed: ${{ needs.mobile.result }}"
            exit 1
          fi
          if [[ "${{ needs.android-native.result }}" != "success" ]]; then
            echo "Android Native failed: ${{ needs.android-native.result }}"
            exit 1
          fi
          if [[ "${{ needs.dashboard.result }}" != "success" ]]; then
            echo "Dashboard failed: ${{ needs.dashboard.result }}"
            exit 1
          fi
          echo "All CI jobs passed."
