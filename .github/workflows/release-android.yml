# Release Android → AAB firmado
#
# Construye un Android App Bundle (.aab) de producción desde un tag inmutable,
# valida la upload key esperada, verifica criptográficamente la firma y publica
# un artifact trazable con checksum + metadata. Opcionalmente puede subir el
# bundle como draft al track Internal de Google Play cuando la cuenta ya esté
# conectada; nunca promueve automáticamente a producción.
name: Release Android

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe "release" para confirmar que este build es intencional'
        required: true
        type: string
      version_name:
        description: 'Versión pública Android, por ejemplo 1.0.0'
        required: true
        default: '1.0.0'
        type: string
      release_ref:
        description: 'Tag inmutable a compilar, por ejemplo v1.0.0'
        required: true
        default: 'v1.0.0'
        type: string
      api_url:
        description: 'Endpoint público HTTPS del backend, incluyendo /api'
        required: true
        type: string
      publish_internal:
        description: 'Subir el AAB firmado como draft a Google Play Internal Testing'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  NODE_VERSION: '22.x'
  NVET_API_URL: ${{ github.event.inputs.api_url }}
  NVET_ANDROID_REQUIRE_SIGNING: 'true'

jobs:
  build-signed-aab:
    name: Build signed AAB
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event.inputs.confirm == 'release' }}
    steps:
      - name: Validate immutable release reference
        env:
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          RELEASE_REF: ${{ github.event.inputs.release_ref }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::version_name debe seguir SemVer (por ejemplo 1.0.0 o 1.0.0-rc.1)"
            exit 1
          fi
          EXPECTED="v${VERSION_NAME}"
          if [ "$RELEASE_REF" != "$EXPECTED" ]; then
            echo "::error::release_ref debe ser exactamente $EXPECTED"
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release_ref }}
          fetch-depth: 1

      - name: Verify checkout is tagged commit
        env:
          RELEASE_REF: ${{ github.event.inputs.release_ref }}
        run: |
          set -euo pipefail
          git fetch --force --tags --depth=1 origin "refs/tags/${RELEASE_REF}:refs/tags/${RELEASE_REF}"
          test "$(git rev-list -n 1 "$RELEASE_REF")" = "$(git rev-parse HEAD)"
          echo "Release commit: $(git rev-parse HEAD)"
          echo "Release ref: $RELEASE_REF"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install canonical workspace dependencies
        run: npm ci --include=dev --legacy-peer-deps

      - name: Verify Gradle wrapper integrity
        working-directory: mobile
        run: |
          set -euo pipefail
          test "$(git hash-object android/gradle/wrapper/gradle-wrapper.jar)" = "e6441136f3d4ba8a0da8d277868979cfbc8ad796"
          ./android/gradlew --version

      - name: Validate release inputs and secrets
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          missing=""
          [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ] && missing="$missing ANDROID_KEY_PASSWORD"
          [ -z "${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}" ] && missing="$missing GOOGLE_MAPS_ANDROID_API_KEY"
          [ -z "$EXPECTED_CERT_SHA256" ] && missing="$missing ANDROID_UPLOAD_CERT_SHA256"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secrets de release:$missing"
            exit 1
          fi
          if ! printf '%s' "$NVET_API_URL" | grep -Eq '^https://[^[:space:]]+/api/?$'; then
            echo "::error::api_url debe ser un endpoint HTTPS absoluto que termine en /api"
            exit 1
          fi
          case "$NVET_API_URL" in
            *localhost*|*127.0.0.1*|*0.0.0.0*|*.invalid/*)
              echo "::error::api_url no puede apuntar a una interfaz local ni a un dominio .invalid"
              exit 1
              ;;
          esac

      - name: Materialize ephemeral release keystore
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/nvet-upload-key.jks"
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "NVET_ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Validate Google Play credential boundary
        if: ${{ inputs.publish_internal }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::publish_internal=true requiere GOOGLE_PLAY_SERVICE_ACCOUNT_JSON en el environment production"
            exit 1
          fi
          node - <<'NODE'
          const raw = process.env.PLAY_SERVICE_ACCOUNT_JSON;
          const json = JSON.parse(raw);
          if (json?.type !== 'service_account' || !json?.client_email || !json?.private_key) {
            throw new Error('GOOGLE_PLAY_SERVICE_ACCOUNT_JSON no es una credencial service-account válida');
          }
          console.log(`Google Play service-account credential shape verified for ${json.client_email}`);
          NODE

      - name: Decode release keystore
        run: printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > mobile/android/app/release.keystore

      - name: Verify upload certificate fingerprint
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          ACTUAL="$(keytool -list -v \
            -keystore "$NVET_ANDROID_KEYSTORE_FILE" \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::La upload key no coincide con el certificado aprobado para Nvet Care"
            exit 1
          fi
          echo "Upload certificate verified."

      - name: Build signed AAB
        working-directory: mobile/android
        env:
          NVET_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NVET_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NVET_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          NVET_ANDROID_VERSION_CODE: ${{ github.run_number }}
          NVET_ANDROID_VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify signed bundle
        run: |
          set -euo pipefail
          AAB=mobile/android/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          unzip -Z1 "$AAB" | grep -Eq '^META-INF/[^/]+\.(RSA|DSA|EC)$'
          # Upload keys are commonly self-signed. Plain jarsigner verification
          # proves the AAB signature without rejecting the expected self-signed
          # certificate chain; the pinned SHA-256 fingerprint above proves that
          # the approved Nvet upload certificate is the signer.
          jarsigner -verify "$AAB"

      - name: Generate release evidence
        env:
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          RELEASE_REF: ${{ github.event.inputs.release_ref }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          AAB=mobile/android/app/build/outputs/bundle/release/app-release.aab
          sha256sum "$AAB" > mobile/android/app/build/outputs/bundle/release/app-release.aab.sha256
          node - <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const releaseGitSha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const metadata = {
            schemaVersion: 1,
            applicationId: 'com.nvetcare',
            versionName: process.env.VERSION_NAME,
            versionCode: Number(process.env.VERSION_CODE),
            gitSha: releaseGitSha,
            releaseRef: process.env.RELEASE_REF,
            targetSdk: 36,
            apiUrl: process.env.NVET_API_URL,
            generatedAt: new Date().toISOString(),
          };
          fs.writeFileSync(
            'mobile/android/app/build/outputs/bundle/release/release-metadata.json',
            `${JSON.stringify(metadata, null, 2)}\n`,
          );
          NODE

      - name: Upload signed AAB as Google Play Internal draft
        id: play_upload
        if: ${{ inputs.publish_internal }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.nvetcare
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: draft
          releaseName: v${{ github.event.inputs.version_name }}

      - name: Remove decoded keystore
        if: always()
        run: |
          if [ -n "${NVET_ANDROID_KEYSTORE_FILE:-}" ]; then
            rm -f "$NVET_ANDROID_KEYSTORE_FILE"
          fi

      - name: Upload signed AAB and evidence
        uses: actions/upload-artifact@v7
        with:
          name: nvetcare-${{ github.event.inputs.version_name }}-${{ github.run_number }}
          path: |
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/outputs/bundle/release/app-release.aab.sha256
            mobile/android/app/build/outputs/bundle/release/release-metadata.json
          if-no-files-found: error
          retention-days: 30

      - name: Release summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Android release'
            echo "- Release ref: ${{ github.event.inputs.release_ref }}"
            echo "- Version: ${{ github.event.inputs.version_name }}"
            echo "- Signed AAB build requested: yes"
            if [ '${{ inputs.publish_internal }}' = 'true' ]; then
              echo "- Google Play Internal draft: ${{ steps.play_upload.outcome }}"
              echo '- Promotion remains manual; this workflow does not release to production.'
            else
              echo '- Google Play upload: not requested'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
