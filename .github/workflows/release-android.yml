# Release Android → AAB firmado
#
# Construye un Android App Bundle (.aab) de producción, lo firma con la
# upload key administrada por el equipo y verifica criptográficamente la
# firma antes de publicar el artifact. No publica en Google Play.
name: Release Android

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe "release" para confirmar que este build es intencional'
        required: true
        type: string
      version_name:
        description: 'Versión pública Android, por ejemplo 1.0.0'
        required: true
        default: '1.0.0'
        type: string

env:
  NODE_VERSION: '22.x'
  # Endpoint público canónico. El AAB firmado nunca debe compilar contra localhost.
  NVET_API_URL: 'https://backend-production-a476.up.railway.app/api'

jobs:
  build-signed-aab:
    name: Build signed AAB
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'release' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install canonical workspace dependencies
        run: npm ci --include=dev --legacy-peer-deps

      - name: Verify Gradle wrapper integrity
        working-directory: mobile
        run: |
          test "$(git hash-object android/gradle/wrapper/gradle-wrapper.jar)" = "e6441136f3d4ba8a0da8d277868979cfbc8ad796"
          ./android/gradlew --version

      - name: Validate release inputs and secrets
        run: |
          missing=""
          [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ] && missing="$missing ANDROID_KEY_PASSWORD"
          [ -z "${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}" ] && missing="$missing GOOGLE_MAPS_ANDROID_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secrets de release:$missing"
            exit 1
          fi
          VERSION_NAME="${{ github.event.inputs.version_name }}"
          if ! printf '%s' "$VERSION_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::version_name debe seguir un formato SemVer como 1.0.0 o 1.0.0-rc.1"
            exit 1
          fi
          if ! printf '%s' "$NVET_API_URL" | grep -Eq '^https://[^[:space:]]+$'; then
            echo "::error::NVET_API_URL debe ser un endpoint HTTPS absoluto de producción"
            exit 1
          fi
          case "$NVET_API_URL" in
            *localhost*|*127.0.0.1*|*0.0.0.0*)
              echo "::error::NVET_API_URL no puede apuntar a una interfaz local en un release"
              exit 1
              ;;
          esac

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > mobile/android/app/release.keystore

      - name: Build signed AAB
        working-directory: mobile/android
        env:
          NVET_ANDROID_KEYSTORE_FILE: release.keystore
          NVET_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NVET_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NVET_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          NVET_ANDROID_VERSION_CODE: ${{ github.run_number }}
          NVET_ANDROID_VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify signed bundle exists
        run: test -s mobile/android/app/build/outputs/bundle/release/app-release.aab

      - name: Verify AAB signature
        run: |
          AAB=mobile/android/app/build/outputs/bundle/release/app-release.aab
          unzip -Z1 "$AAB" | grep -Eq '^META-INF/[^/]+\.(RSA|DSA|EC)$'
          jarsigner -verify "$AAB"

      - name: Remove decoded keystore
        if: always()
        run: rm -f mobile/android/app/release.keystore

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: nvetcare-${{ github.event.inputs.version_name }}-${{ github.run_number }}
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
