name: Bootstrap Android Gradle Wrapper

on:
  push:
    branches:
      - feat/phase-3-native-mobile
    paths:
      - '.github/workflows/bootstrap-android-wrapper.yml'

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/phase-3-native-mobile
          fetch-depth: 0

      - name: Fetch exact React Native 0.75.4 Gradle wrapper JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile/android/gradle/wrapper
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/react-native-community/rn-diff-purge/release/0.75.4/RnDiffApp/android/gradle/wrapper/gradle-wrapper.jar' \
            --output mobile/android/gradle/wrapper/gradle-wrapper.jar

          ACTUAL_SHA="$(git hash-object mobile/android/gradle/wrapper/gradle-wrapper.jar)"
          EXPECTED_SHA='e6441136f3d4ba8a0da8d277868979cfbc8ad796'
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || {
            echo "Wrapper integrity mismatch: expected $EXPECTED_SHA, got $ACTUAL_SHA" >&2
            exit 1
          }

      - name: Commit verified binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/android/gradle/wrapper/gradle-wrapper.jar
          if git diff --cached --quiet; then
            echo 'Verified wrapper already present.'
            exit 0
          fi
          git commit -m 'chore(android): add verified RN 0.75.4 Gradle wrapper jar'
          git push origin HEAD:feat/phase-3-native-mobile
