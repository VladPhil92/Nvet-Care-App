name: Phase 11E Staging Session Smoke

on:
  push:
    branches:
      - feat/autonomous-staging-certification-20260901
    paths:
      - 'scripts/railway-staging-session.mjs'
      - 'backend/prisma/seed.ts'
      - '.github/workflows/phase-11e-staging-smoke.yml'

permissions:
  contents: read

concurrency:
  group: nvet-phase-11e-staging-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Rotate, deploy and certify isolated staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: 61c97ce7-fd4d-4d8d-9e28-8c0ef964d8cd
      RAILWAY_STAGING_ENVIRONMENT_ID: 9267d965-e5e4-4c6f-af93-001c73cf62b4
      RAILWAY_STAGING_SERVICE_ID: dc5c2eee-3f8d-4416-8854-a921ea694735
      RAILWAY_PRODUCTION_SERVICE_ID: 42e734a0-931b-45c8-a091-4334b54e9d1c
      RC_CANDIDATE_SHA: ${{ github.sha }}
      NVET_PAYMENT_CERTIFICATION_TARGET: staging

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Prepare autonomous staging session
        run: node scripts/railway-staging-session.mjs prepare

      - name: Verify staging identity and discovery
        run: node mobile/e2e/preflight.mjs

      - name: Verify staging TRANSFER lifecycle
        run: node scripts/certify-transfer-payment-rail.mjs

      - name: Smoke summary
        if: always()
        run: |
          {
            echo '## Phase 11E staging smoke'
            echo "- Candidate: \`${GITHUB_SHA}\`"
            echo '- Target: canonical Railway staging service only.'
            echo '- Credentials: generated at runtime, stored in Railway staging, masked in Actions.'
            echo '- Checks: candidate deploy + readiness revision + CLIENT/VET preflight + CLIENT→VET→ADMIN TRANSFER lifecycle.'
          } >> "$GITHUB_STEP_SUMMARY"
